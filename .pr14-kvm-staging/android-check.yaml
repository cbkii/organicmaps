name: Android Check
on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - master
  pull_request:
    paths-ignore:
      - .gitignore
      - .github/**
      - '!.github/workflows/android-check.yaml'  # Run check on self change
      - '**/*_tests/**'
      - CONTRIBUTORS
      - LICENSE
      - NOTICE
      - README.md
      - android/app/src/fdroid/**
      - android/app/src/google/**
      - iphone/**
      - data/organic_maps_emoji/**
      - data/strings/**
      - docs/**
      - generator/**
      - packaging/**
      - platform/*apple*
      - platform/*_ios*
      - platform/*_linux*
      - platform/*_mac*
      - platform/*qt*
      - platform/*_win*
      - qt*/**
      - skin_generator/**
      - tools/**
      - track_generator/**

jobs:
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64  # Java 17 is required for Android Gradle 8 plugin
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Verify InCar chrome contrast
        shell: bash
        run: |
          python3 -m py_compile android/tools/verify_in_car_contrast.py
          python3 android/tools/verify_in_car_contrast.py

      - name: Lint
        shell: bash
        working-directory: android
        run: ./gradlew lintAllModules

      # Reviewdog is needed for the action below to report issues in the PR.
      - name: Install reviewdog
        uses: reviewdog/action-setup@v1

      - name: Report Android Lint Results
        uses: ilyagulya/android-lint-action@v0.12.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          lint_xml_file: android/build/reports/lint/lint.xml
          reporter: github-pr-review
          level: warning

      - name: Upload Android Lint Report
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: android/build/reports/lint/lint.xml
          retention-days: 30

  android-check:
    name: Build Android Debug
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      CI_IN_CAR_RELEASE_VERSION: '0.0.0'
      CI_IN_CAR_RELEASE_VERSION_CODE: '1000000000'
    strategy:
      fail-fast: false
      matrix:
        flavor: [WebDebug, FdroidDebug, InCarProfileable]
        include:
          - flavor: WebDebug
            arch: arm64
            run-tests: true
            verify_in_car: false
            artifact_path: android/app/build/outputs/apk/web/debug/OrganicMaps-*.apk
          - flavor: FdroidDebug
            arch: arm32
            verify_in_car: false
            artifact_path: android/app/build/outputs/apk/fdroid/debug/OrganicMaps-*.apk
          - flavor: InCarProfileable
            arch: arm64
            verify_in_car: true
            artifact_path: android/app/build/outputs/apk/inCar/profileable/OrganicMaps-*.apk
    # Cancels previous jobs if the same branch or PR was updated again.
    # Only cancel PR runs: master runs must finish to populate the shared ccache.
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.flavor }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Install build tools and dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build

      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          # Needed for versioning script
          fetch-depth: 200 # enough to get all commits for the current day

      - name: Cache Boost submodule
        uses: ./.github/actions/cache-boost

      - name: Parallel submodules checkout
        shell: bash
        run: git submodule update --depth 1 --init --recursive --jobs=$(($(nproc) * 20))

      - name: Configure repository
        shell: bash
        run: ./configure.sh

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.workflow }}-${{ matrix.flavor }}
          # Restore-only on PRs: master populates the shared cache, PRs read it.
          # Avoids overflowing the 10GB repo limit, which evicts master's caches.
          save: ${{ github.ref == 'refs/heads/master' }}

      - name: Compile ${{ matrix.flavor }}
        shell: bash
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cmake --version
          ninja --version
          ./gradlew -P${{ matrix.arch }} assemble${{ matrix.flavor }}

      - name: Build arm64 FdroidProfileable comparison
        if: matrix.verify_in_car == true
        shell: bash
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./gradlew -Parm64 assembleFdroidProfileable

      - name: Verify InCarProfileable package
        if: matrix.verify_in_car == true
        shell: bash
        run: |
          proof_dir="${RUNNER_TEMP}/in-car-package-proof"
          mkdir -p "${proof_dir}"

          mapfile -t in_car_apks < <(find android/app/build/outputs/apk/inCar/profileable -maxdepth 1 -type f -name '*.apk' -print | sort)
          mapfile -t reference_apks < <(find android/app/build/outputs/apk/fdroid/profileable -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [[ "${#in_car_apks[@]}" -ne 1 || "${#reference_apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one InCarProfileable and one FdroidProfileable APK."
            printf 'in-car: %s\n' "${in_car_apks[*]:-none}"
            printf 'reference: %s\n' "${reference_apks[*]:-none}"
            exit 1
          fi

          bash android/tools/verify_in_car_apk.sh \
            --apk "${in_car_apks[0]}" \
            --expected-package app.organicmaps.incar.profileable \
            --proof-dir "${proof_dir}" \
            --summary-file "${GITHUB_STEP_SUMMARY}"

          in_car_size="$(stat -c '%s' "${in_car_apks[0]}")"
          reference_size="$(stat -c '%s' "${reference_apks[0]}")"
          delta="$((in_car_size - reference_size))"
          {
            echo
            echo '### In-car profileable comparison'
            echo
            echo "- InCarProfileable bytes: \`${in_car_size}\`"
            echo "- FdroidProfileable bytes: \`${reference_size}\`"
            echo "- In-car minus reference: \`${delta}\` bytes"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Configure CI release signing
        if: matrix.verify_in_car == true
        id: ci_release_signing
        shell: bash
        run: |
          keystore="${RUNNER_TEMP}/in-car-ci-release.keystore"
          store_password='organicmaps-ci'
          alias_name='organicmaps-ci'
          key_password='organicmaps-ci'

          if ! keytool -genkeypair -noprompt \
              -keystore "${keystore}" \
              -storepass "${store_password}" \
              -keypass "${key_password}" \
              -alias "${alias_name}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1 \
              -dname 'CN=Organic Maps In-Car CI, OU=CI, O=Organic Maps, L=CI, ST=CI, C=AU'; then
            echo "::error::Unable to create the ephemeral InCarRelease CI signing key."
            exit 1
          fi
          chmod 600 "${keystore}"

          keytool_output="${RUNNER_TEMP}/in-car-ci-keytool.txt"
          if ! keytool -list -v \
              -keystore "${keystore}" \
              -alias "${alias_name}" \
              -storepass "${store_password}" > "${keytool_output}" 2>&1; then
            echo "::error::Unable to inspect the ephemeral InCarRelease CI signing key."
            exit 1
          fi
          cert_sha256="$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' "${keytool_output}" | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "${cert_sha256}" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::Unable to resolve the ephemeral InCarRelease CI signer fingerprint."
            exit 1
          fi

          : > android/app/secure.properties
          echo "keystore=${keystore}" >> "${GITHUB_OUTPUT}"
          echo "store_password=${store_password}" >> "${GITHUB_OUTPUT}"
          echo "alias=${alias_name}" >> "${GITHUB_OUTPUT}"
          echo "key_password=${key_password}" >> "${GITHUB_OUTPUT}"
          echo "cert_sha256=${cert_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Build release-equivalent arm64 InCarRelease
        if: matrix.verify_in_car == true
        shell: bash
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          KEYSTORE_PATH: ${{ steps.ci_release_signing.outputs.keystore }}
          KEYSTORE_PASSWORD: ${{ steps.ci_release_signing.outputs.store_password }}
          KEY_ALIAS: ${{ steps.ci_release_signing.outputs.alias }}
          KEY_PASSWORD: ${{ steps.ci_release_signing.outputs.key_password }}
        run: |
          export ORG_GRADLE_PROJECT_spropStoreFile="${KEYSTORE_PATH}"
          export ORG_GRADLE_PROJECT_spropStorePassword="${KEYSTORE_PASSWORD}"
          export ORG_GRADLE_PROJECT_spropKeyAlias="${KEY_ALIAS}"
          export ORG_GRADLE_PROJECT_spropKeyPassword="${KEY_PASSWORD}"
          ./gradlew --no-daemon --stacktrace \
            -Parm64 \
            -PinCarReleaseVersionName="${CI_IN_CAR_RELEASE_VERSION}" \
            -PinCarReleaseVersionCode="${CI_IN_CAR_RELEASE_VERSION_CODE}" \
            assembleInCarRelease

      - name: Verify release-equivalent InCarRelease
        if: matrix.verify_in_car == true
        shell: bash
        run: |
          proof_dir="${RUNNER_TEMP}/in-car-release-ci-proof"
          mkdir -p "${proof_dir}"
          mapfile -t release_apks < <(find android/app/build/outputs/apk/inCar/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [[ "${#release_apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one release-equivalent InCarRelease APK; found ${#release_apks[@]}."
            printf '%s\n' "${release_apks[@]:-}"
            exit 1
          fi

          bash android/tools/verify_in_car_apk.sh \
            --apk "${release_apks[0]}" \
            --expected-package app.organicmaps.incar \
            --expected-version-name "${CI_IN_CAR_RELEASE_VERSION}-InCar" \
            --expected-version-code "${CI_IN_CAR_RELEASE_VERSION_CODE}" \
            --expected-cert-sha256 "${{ steps.ci_release_signing.outputs.cert_sha256 }}" \
            --proof-dir "${proof_dir}" \
            --summary-file "${GITHUB_STEP_SUMMARY}"

      - name: Upload release-equivalent InCarRelease APK
        if: matrix.verify_in_car == true
        uses: actions/upload-artifact@v7
        with:
          name: android-InCarRelease-ci
          path: android/app/build/outputs/apk/inCar/release/OrganicMaps-*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Stage release diagnostics
        if: matrix.verify_in_car == true
        id: release_diagnostics
        shell: bash
        run: |
          set -euo pipefail

          diagnostics_dir="${RUNNER_TEMP}/in-car-release-ci-diagnostics"
          symbols="android/app/build/outputs/native-debug-symbols/inCarRelease/native-debug-symbols.zip"
          mapping="android/app/build/outputs/mapping/inCarRelease/mapping.txt"
          if [[ ! -f "${symbols}" || ! -f "${mapping}" ]]; then
            echo "::error::Expected InCarRelease native symbols and R8 mapping were not produced."
            exit 1
          fi
          mkdir -p "${diagnostics_dir}"
          cp "${symbols}" "${diagnostics_dir}/native-debug-symbols.zip"
          cp "${mapping}" "${diagnostics_dir}/mapping.txt"
          echo "path=${diagnostics_dir}" >> "${GITHUB_OUTPUT}"

      - name: Upload release diagnostics
        if: matrix.verify_in_car == true
        uses: actions/upload-artifact@v7
        with:
          name: android-InCarRelease-ci-diagnostics
          path: ${{ steps.release_diagnostics.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove CI release signing material
        if: always() && matrix.verify_in_car == true
        shell: bash
        run: |
          rm -f \
            android/app/secure.properties \
            "${RUNNER_TEMP}/in-car-ci-release.keystore" \
            "${RUNNER_TEMP}/in-car-ci-keytool.txt"

      - name: Compile Wear Google Debug
        if: matrix.flavor == 'WebDebug'
        shell: bash
        working-directory: android
        run: ./gradlew :wear:assembleGoogleDebug

      - name: Free disk space for emulator
        if: matrix.run-tests == true
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null

      - name: Enable KVM
        if: matrix.run-tests == true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests
        if: matrix.run-tests == true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            cd android && ./gradlew -P${{ matrix.arch }} app:test${{ matrix.flavor }} sdk:testDebug sdk:connectedDebugAndroidTest

      - name: Upload ${{ matrix.flavor }} apk
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.flavor }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30

  in-car-release-smoke:
    name: Smoke signed InCarRelease on ARM64
    needs: android-check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout smoke script
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download signed release-equivalent APK
        uses: actions/download-artifact@v7
        with:
          name: android-InCarRelease-ci
          path: ${{ runner.temp }}/in-car-release-ci

      - name: Resolve signed APK
        id: apk
        shell: bash
        run: |
          apk_count="$(find "${RUNNER_TEMP}/in-car-release-ci" -type f -name '*.apk' | wc -l | tr -d ' ')"
          if [[ "${apk_count}" -ne 1 ]]; then
            echo "::error::Expected exactly one signed InCarRelease APK; found ${apk_count}."
            exit 1
          fi
          apk_path="$(find "${RUNNER_TEMP}/in-car-release-ci" -type f -name '*.apk' -print -quit)"
          echo "path=${apk_path}" >> "${GITHUB_OUTPUT}"

      - name: Verify KVM access
        shell: bash
        run: |
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::This ARM64 runner does not expose /dev/kvm."
            exit 1
          fi
          ls -l /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::KVM exists but is not readable/writable by the runner."
            exit 1
          fi

      - name: Smoke exact signed arm64 InCarRelease APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: arm64-v8a
          target: default
          emulator-boot-timeout: 900
          script: bash android/tools/smoke_test_in_car_apk.sh --apk "${{ steps.apk.outputs.path }}" --package app.organicmaps.incar --proof-dir "${RUNNER_TEMP}/in-car-release-ci-launch-smoke"

      - name: Upload signed InCar launch smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-InCarRelease-ci-launch-smoke
          path: ${{ runner.temp }}/in-car-release-ci-launch-smoke
          if-no-files-found: warn
          retention-days: 90
