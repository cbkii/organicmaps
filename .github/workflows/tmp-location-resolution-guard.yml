name: Temporary Location Resolution Guard

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/incar-location-prompt-idempotency'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/incar-location-prompt-idempotency

      - name: Apply final location resolution guard
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_location_resolution.py
          python3 /tmp/patch_location_resolution.py
          rm .github/workflows/tmp-location-resolution-guard.yml
          git diff --check

      - name: Commit guard and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/app/organicmaps/MwmActivity.java .github/workflows/tmp-location-resolution-guard.yml
          git commit -m 'Guard location resolution transitions'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
