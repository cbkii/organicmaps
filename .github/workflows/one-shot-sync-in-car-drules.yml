name: One-shot sync InCar drawing rules

on:
  push:
    branches:
      - ux/incar-clarity-high-glare
    paths:
      - '.github/workflows/one-shot-sync-in-car-drules.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Checkout Kothic style compiler
        shell: bash
        run: git submodule update --init --depth 1 tools/kothic

      - name: Generate and package InCar drawing rules
        shell: bash
        run: |
          tools/unix/generate_drules.sh
          cp data/drules_in_car.bin android/sdk/src/main/assets/drules_in_car.bin

      - name: Commit exact generated artefacts
        shell: bash
        run: |
          git add data/drules_in_car.bin data/drules_in_car.txt android/sdk/src/main/assets/drules_in_car.bin
          if git diff --cached --quiet; then
            echo 'Generated InCar drawing rules are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[styles] Regenerate InCar drawing rules'
          git push origin "HEAD:${GITHUB_REF_NAME}"
