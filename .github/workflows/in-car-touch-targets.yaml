name: InCar Touch Target Check

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/in-car-touch-targets.yaml'
      - 'android/app/src/inCar/**'
      - 'android/app/src/main/java/app/organicmaps/incar/**'
      - 'android/app/src/main/java/app/organicmaps/maplayer/MapButtonsController.java'
      - 'android/app/src/main/java/app/organicmaps/settings/InCarSettingsFragment.java'
      - 'android/app/src/main/java/app/organicmaps/settings/InCarQuickDestinationsSettingsFragment.java'
      - 'android/app/src/main/java/app/organicmaps/util/InCarVisuals.java'
      - 'android/app/src/main/java/app/organicmaps/util/bottomsheet/**'
      - 'android/app/src/main/java/app/organicmaps/widget/menu/MyPositionButton.java'
      - 'android/app/src/main/res/layout/bottom_sheet_menu_item.xml'
      - 'android/app/src/main/res/layout/in_car_driving_overlay.xml'
      - 'android/app/src/main/res/layout/routing_bottom_sheet.xml'
      - 'android/app/src/main/res/layout-land/routing_bottom_sheet.xml'
      - 'android/app/src/main/res/values/in_car_*.xml'
      - 'android/app/src/main/res/xml/prefs_in_car.xml'
      - 'android/sdk/src/main/cpp/app/organicmaps/sdk/LocationState.cpp'
      - 'android/sdk/src/main/java/app/organicmaps/sdk/location/LocationState.java'
      - 'android/tools/capture_in_car_validation.py'
      - 'android/tools/ts18_termux_in_car_ux_capture.sh'
      - 'android/tools/verify_in_car_touch_targets.py'
      - 'android/tools/verify_in_car_touch_targets_rail.py'
      - 'android/tools/verify_in_car_compact_chrome.py'
      - 'android/tools/verify_in_car_location_recording_controls.py'
      - 'android/tools/tests/test_in_car_controls.py'
      - 'libs/drape_frontend/*position*'
      - 'libs/drape_frontend/drape_engine.*'
      - 'libs/drape_frontend/frontend_renderer.cpp'
      - 'libs/drape_frontend/message_subclasses.hpp'
  pull_request:
    paths:
      - '.github/workflows/in-car-touch-targets.yaml'
      - 'android/app/src/inCar/**'
      - 'android/app/src/main/java/app/organicmaps/incar/**'
      - 'android/app/src/main/java/app/organicmaps/maplayer/MapButtonsController.java'
      - 'android/app/src/main/java/app/organicmaps/settings/InCarSettingsFragment.java'
      - 'android/app/src/main/java/app/organicmaps/settings/InCarQuickDestinationsSettingsFragment.java'
      - 'android/app/src/main/java/app/organicmaps/util/InCarVisuals.java'
      - 'android/app/src/main/java/app/organicmaps/util/bottomsheet/**'
      - 'android/app/src/main/java/app/organicmaps/widget/menu/MyPositionButton.java'
      - 'android/app/src/main/res/layout/bottom_sheet_menu_item.xml'
      - 'android/app/src/main/res/layout/in_car_driving_overlay.xml'
      - 'android/app/src/main/res/layout/routing_bottom_sheet.xml'
      - 'android/app/src/main/res/layout-land/routing_bottom_sheet.xml'
      - 'android/app/src/main/res/values/in_car_*.xml'
      - 'android/app/src/main/res/xml/prefs_in_car.xml'
      - 'android/sdk/src/main/cpp/app/organicmaps/sdk/LocationState.cpp'
      - 'android/sdk/src/main/java/app/organicmaps/sdk/location/LocationState.java'
      - 'android/tools/capture_in_car_validation.py'
      - 'android/tools/ts18_termux_in_car_ux_capture.sh'
      - 'android/tools/verify_in_car_touch_targets.py'
      - 'android/tools/verify_in_car_touch_targets_rail.py'
      - 'android/tools/verify_in_car_compact_chrome.py'
      - 'android/tools/verify_in_car_location_recording_controls.py'
      - 'android/tools/tests/test_in_car_controls.py'
      - 'libs/drape_frontend/*position*'
      - 'libs/drape_frontend/drape_engine.*'
      - 'libs/drape_frontend/frontend_renderer.cpp'
      - 'libs/drape_frontend/message_subclasses.hpp'

permissions:
  contents: read

jobs:
  verify:
    name: Verify InCar automotive touch targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Verify touch-target contract
        shell: bash
        run: |
          bash -n android/tools/ts18_termux_in_car_ux_capture.sh
          python3 -m py_compile \
            android/tools/capture_in_car_validation.py \
            android/tools/verify_in_car_touch_targets.py \
            android/tools/verify_in_car_touch_targets_rail.py \
            android/tools/verify_in_car_compact_chrome.py \
            android/tools/verify_in_car_location_recording_controls.py
          python3 -X dev -W default android/tools/verify_in_car_touch_targets_rail.py
          python3 -X dev -W default android/tools/verify_in_car_compact_chrome.py
          python3 -X dev -W default android/tools/verify_in_car_location_recording_controls.py
          python3 -m unittest discover -s android/tools/tests -p test_in_car_controls.py
