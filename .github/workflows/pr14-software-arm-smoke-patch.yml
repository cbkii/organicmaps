name: PR14 Software ARM Smoke Patch

on:
  push:
    branches:
      - fix/in-car-startup-release-guard
    paths:
      - .github/workflows/pr14-software-arm-smoke-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'cbkii/organicmaps' && github.ref == 'refs/heads/fix/in-car-startup-release-guard'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: fix/in-car-startup-release-guard

      - name: Patch ARM smoke for software emulation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          kvm = '      - name: Verify KVM access\n        shell: bash\n        run: |\n          if [[ ! -e /dev/kvm ]]; then\n            echo "::error::This ARM64 runner does not expose /dev/kvm."\n            exit 1\n          fi\n          ls -l /dev/kvm\n          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then\n            sudo chmod 666 /dev/kvm\n          fi\n          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then\n            echo "::error::KVM exists but is not readable/writable by the runner."\n            exit 1\n          fi\n\n'
          action_old = '          target: default\n          emulator-boot-timeout: 900\n'
          action_new = '          target: default\n          disable-linux-hw-accel: true\n          emulator-boot-timeout: 900\n'

          def patch_section(path: str, marker: str) -> None:
              file = Path(path)
              text = file.read_text()
              if marker not in text:
                  raise SystemExit(f"{path}: section marker not found")
              before, section = text.split(marker, 1)
              if section.count(kvm) != 1:
                  raise SystemExit(f"{path}: expected one KVM block in target section, found {section.count(kvm)}")
              section = section.replace(kvm, '', 1)
              if section.count(action_old) != 1:
                  raise SystemExit(f"{path}: expected one emulator config in target section, found {section.count(action_old)}")
              section = section.replace(action_old, action_new, 1)
              file.write_text(before + marker + section)

          patch_section('.github/workflows/android-check.yaml', '  in-car-release-smoke:\n')
          patch_section('.github/workflows/manual-in-car-release.yml', '  smoke:\n    name: Smoke signed InCarRelease on ARM64\n')
          PY

          git diff --check

      - name: Stage patched workflow blobs outside workflow paths
        shell: bash
        run: |
          mkdir -p .pr14-arm-smoke-staging
          cp .github/workflows/android-check.yaml .pr14-arm-smoke-staging/android-check.yaml
          cp .github/workflows/manual-in-car-release.yml .pr14-arm-smoke-staging/manual-in-car-release.yml
          git checkout -- .github/workflows/android-check.yaml .github/workflows/manual-in-car-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pr14-arm-smoke-staging/android-check.yaml .pr14-arm-smoke-staging/manual-in-car-release.yml
          git diff --cached --check
          git commit -m 'chore: stage software ARM smoke workflow fix'
          git push origin HEAD:fix/in-car-startup-release-guard
