name: Refine low-speed road matching

on:
  push:
    branches:
      - fix/incar-low-speed-road-matching
    paths:
      - '.github/workflows/_refine-low-speed-road-matching.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/incar-low-speed-road-matching
          fetch-depth: 1

      - name: Keep refinements low-speed-only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          policy = Path('libs/routing/free_driving_road_snap_policy.hpp')
          text = policy.read_text()
          old = '''inline double ProgressScaleM(location::GpsInfo const & info, double expectedM, double motionConfidence)
{
  double floorM = 10.0;
  auto const accuracy = GetAccuracyBand(info);
  if (accuracy == AccuracyBand::Good && motionConfidence >= 0.35)
  {
    double const confidence = std::clamp((motionConfidence - 0.35) / 0.65, 0.0, 1.0);
    floorM = 6.0 - 2.0 * confidence;
  }
  else if (accuracy == AccuracyBand::Moderate && motionConfidence >= 0.60)
  {
    floorM = 7.0;
  }
  return std::max(floorM, expectedM + 3.0);
}
'''
          new = '''inline double ProgressScaleM(location::GpsInfo const & info, double expectedM, double motionConfidence)
{
  // Preserve PR #38's normal/cruise-speed scale exactly. Finer progress discrimination is only
  // admitted while crawling and only when trajectory evidence is coherent enough to support it.
  if (!info.HasSpeed() || info.m_speed > kCruiseSpeedMps)
    return std::max(10.0, expectedM + 5.0);

  double floorM = 10.0;
  double paddingM = 5.0;
  auto const accuracy = GetAccuracyBand(info);
  if (accuracy == AccuracyBand::Good && motionConfidence >= 0.35)
  {
    double const confidence = std::clamp((motionConfidence - 0.35) / 0.65, 0.0, 1.0);
    floorM = 6.0 - 2.0 * confidence;
    paddingM = 3.0;
  }
  else if (accuracy == AccuracyBand::Moderate && motionConfidence >= 0.60)
  {
    floorM = 7.0;
    paddingM = 4.0;
  }
  return std::max(floorM, expectedM + paddingM);
}
'''
          if text.count(old) != 1:
            raise SystemExit('ProgressScaleM source shape changed')
          policy.write_text(text.replace(old, new, 1))

          session = Path('libs/routing/routing_session_free_driving.cpp')
          text = session.read_text()
          old = '''  location::GpsInfo policyInfo = rawLocation;
  double const effectiveSpeedMps =
      free_driving_snap::EffectiveSpeedMps(rawLocation, rawStepM, observationIntervalSeconds);
  if (!policyInfo.HasSpeed() && observationIntervalSeconds > 0.0)
    policyInfo.m_speed = effectiveSpeedMps;
'''
          new = '''  location::GpsInfo policyInfo = rawLocation;
  double const effectiveSpeedMps =
      free_driving_snap::EffectiveSpeedMps(rawLocation, rawStepM, observationIntervalSeconds);
  if (rawLocation.HasSpeed() || observationIntervalSeconds > 0.0)
    policyInfo.m_speed = effectiveSpeedMps;
'''
          if text.count(old) != 1:
            raise SystemExit('policy speed source shape changed')
          session.write_text(text.replace(old, new, 1))

          tests = Path('libs/routing/routing_tests/free_driving_road_snap_policy_tests.cpp')
          text = tests.read_text()
          marker = '''UNIT_TEST(FreeDrivingRoadSnapPolicy_LowSpeedProgressUsesFinerScaleOnlyWithEvidence)
{
  auto good = MakeFix(4.0 / 3.6, 6.0, 1.0);
  TEST_LESS(ProgressScaleM(good, 2.0, 0.8), ProgressScaleM(good, 2.0, 0.0), ());
  auto moderate = MakeFix(4.0 / 3.6, 25.0, 1.0);
  TEST_ALMOST_EQUAL_ULPS(ProgressScaleM(moderate, 2.0, 0.2), 10.0, ());
}
'''
          replacement = '''UNIT_TEST(FreeDrivingRoadSnapPolicy_LowSpeedProgressUsesFinerScaleOnlyWithEvidence)
{
  auto good = MakeFix(4.0 / 3.6, 6.0, 1.0);
  TEST_LESS(ProgressScaleM(good, 2.0, 0.8), ProgressScaleM(good, 2.0, 0.0), ());
  auto moderate = MakeFix(4.0 / 3.6, 25.0, 1.0);
  TEST_ALMOST_EQUAL_ULPS(ProgressScaleM(moderate, 2.0, 0.2), 10.0, ());
  auto cruising = MakeFix(40.0 / 3.6, 6.0, 1.0);
  TEST_ALMOST_EQUAL_ULPS(ProgressScaleM(cruising, 20.0, 1.0), 25.0, ());
}
'''
          if text.count(marker) != 1:
            raise SystemExit('progress test source shape changed')
          tests.write_text(text.replace(marker, replacement, 1))
          PY
          git diff --check

      - name: Format edited C++
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-19
          clang-format-19 -i \
            libs/routing/free_driving_road_snap_policy.hpp \
            libs/routing/routing_session_free_driving.cpp \
            libs/routing/routing_tests/free_driving_road_snap_policy_tests.cpp
          git diff --check

      - name: Commit refinement and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/_refine-low-speed-road-matching.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep matcher refinements low-speed scoped'
          git push origin HEAD:fix/incar-low-speed-road-matching
