name: Squash auto-follow feature branch

on:
  push:
    branches:
      - feature/auto-follow-location-launch
    paths:
      - .github/workflows/squash-auto-follow-branch.yml

permissions:
  contents: write

jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-follow-location-launch
          fetch-depth: 0

      - name: Rewrite branch to one clean feature commit
        run: |
          git config user.name "cbkii"
          git config user.email "150587541+cbkii@users.noreply.github.com"
          git fetch origin master
          rm .github/workflows/squash-auto-follow-branch.yml
          git reset --soft origin/master
          git add -A
          git commit -s -m "[android] Add launch location-follow preference"
          git push --force-with-lease origin HEAD:feature/auto-follow-location-launch
