name: PR48 one-shot location fix

on:
  push:
    branches:
      - fix/incar-location-prompt-idempotency

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run PR48 lifecycle completion v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/incar-location-prompt-idempotency
          fetch-depth: 0

      - name: Apply lifecycle completion
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/pr48_patch.py
          python3 /tmp/pr48_patch.py
          git diff --check
          git diff --stat

      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete location settings lifecycle hardening'
          git push origin HEAD:fix/incar-location-prompt-idempotency
