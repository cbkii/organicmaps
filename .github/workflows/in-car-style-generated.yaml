name: InCar Generated Style Check

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/in-car-style-generated.yaml'
      - '.gitmodules'
      - 'data/styles/in_car/**'
      - 'data/styles/vehicle/**'
      - 'data/styles/default/include/**'
      - 'data/drules_in_car.bin'
      - 'data/drules_in_car.txt'
      - 'tools/unix/generate_drules.sh'
      - 'tools/ci/verify_in_car_light_palette.py'
      - 'tools/kothic'
      - 'tools/kothic/**'
  pull_request:
    paths:
      - '.github/workflows/in-car-style-generated.yaml'
      - '.gitmodules'
      - 'data/styles/in_car/**'
      - 'data/styles/vehicle/**'
      - 'data/styles/default/include/**'
      - 'data/drules_in_car.bin'
      - 'data/drules_in_car.txt'
      - 'tools/unix/generate_drules.sh'
      - 'tools/ci/verify_in_car_light_palette.py'
      - 'tools/kothic'
      - 'tools/kothic/**'

# Temporary, branch-scoped write permission is used only to materialise the
# canonical generated drules for this same-repository PR. The next engineering
# commit restores this workflow to contents: read.
permissions:
  contents: write

jobs:
  verify:
    name: Verify generated InCar drawing rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Checkout Kothic style compiler
        shell: bash
        run: git submodule update --init --depth 1 tools/kothic

      - name: Verify high-glare InCar light palette
        shell: bash
        run: python3 -X dev -W default tools/ci/verify_in_car_light_palette.py

      - name: Generate drawing rules
        shell: bash
        run: tools/unix/generate_drules.sh

      - name: Commit generated rules for this PR branch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/incar-high-glare-light-palette' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/drules_in_car.bin data/drules_in_car.txt
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate InCar drawing rules"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload generated InCar rules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-in-car-drules
          path: |
            data/drules_in_car.bin
            data/drules_in_car.txt
          if-no-files-found: error
          retention-days: 1

      - name: Verify checked-in InCar rules are current
        shell: bash
        run: git diff --exit-code -- data/drules_in_car.bin data/drules_in_car.txt
