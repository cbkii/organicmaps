name: InCar Generated Style Materialisation

on:
  push:
    branches:
      - fix/incar-high-glare-light-palette
    paths:
      - '.github/workflows/in-car-style-generated.yaml'

permissions:
  contents: write

jobs:
  materialise:
    name: Materialise generated InCar rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/incar-high-glare-light-palette
          persist-credentials: true

      - name: Checkout Kothic style compiler
        shell: bash
        run: git submodule update --init --depth 1 tools/kothic

      - name: Generate drawing rules
        shell: bash
        run: tools/unix/generate_drules.sh

      - name: Verify generated light style
        shell: bash
        run: python3 -X dev -W default tools/ci/verify_in_car_light_palette.py

      - name: Commit canonical and packaged generated rules
        shell: bash
        run: |
          cp data/drules_in_car.bin android/sdk/src/main/assets/drules_in_car.bin
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/drules_in_car.bin data/drules_in_car.txt android/sdk/src/main/assets/drules_in_car.bin
          if git diff --cached --quiet; then
            echo "Generated InCar rules are already current."
            exit 0
          fi
          git commit -m "Regenerate compiled InCar light-style rules"
          git push origin HEAD:fix/incar-high-glare-light-palette
