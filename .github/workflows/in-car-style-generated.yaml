name: InCar Generated Style Check

on:
  push:
    branches:
      - master
      - fix/incar-v111-runtime-hardening
    paths:
      - '.github/workflows/in-car-style-generated.yaml'
      - '.gitmodules'
      - 'data/styles/in_car/**'
      - 'data/styles/vehicle/**'
      - 'data/styles/default/include/**'
      - 'data/drules_in_car.bin'
      - 'data/drules_in_car.txt'
      - 'tools/unix/generate_drules.sh'
      - 'tools/kothic'
      - 'tools/kothic/**'
  pull_request:
    paths:
      - '.github/workflows/in-car-style-generated.yaml'
      - '.gitmodules'
      - 'data/styles/in_car/**'
      - 'data/styles/vehicle/**'
      - 'data/styles/default/include/**'
      - 'data/drules_in_car.bin'
      - 'data/drules_in_car.txt'
      - 'tools/unix/generate_drules.sh'
      - 'tools/kothic'
      - 'tools/kothic/**'

permissions:
  contents: write

jobs:
  verify:
    name: Verify generated InCar drawing rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Checkout Kothic style compiler
        shell: bash
        run: git submodule update --init --depth 1 tools/kothic

      - name: Generate drawing rules
        shell: bash
        run: tools/unix/generate_drules.sh

      - name: Commit generated InCar rules on the hardening branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/incar-v111-runtime-hardening'
        shell: bash
        run: |
          if git diff --quiet -- data/drules_in_car.bin data/drules_in_car.txt; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/drules_in_car.bin data/drules_in_car.txt
          git commit -m 'Regenerate InCar drawing rules'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload generated InCar rules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-in-car-drules
          path: |
            data/drules_in_car.bin
            data/drules_in_car.txt
          if-no-files-found: error
          retention-days: 1

      - name: Verify checked-in InCar rules are current
        shell: bash
        run: git diff --exit-code -- data/drules_in_car.bin data/drules_in_car.txt
