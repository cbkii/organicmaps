name: InCar Generated Style Materialisation

on:
  pull_request:
    paths:
      - '.github/workflows/in-car-style-generated.yaml'
      - 'data/styles/in_car/**'
      - 'data/drules_in_car.bin'
      - 'data/drules_in_car.txt'
      - 'android/sdk/src/main/assets/drules_in_car.bin'
      - 'tools/ci/verify_in_car_light_palette.py'

permissions:
  contents: write

jobs:
  materialise:
    name: Materialise canonical generated InCar rules
    if: github.head_ref == 'fix/incar-high-glare-light-palette' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Checkout Kothic style compiler
        shell: bash
        run: git submodule update --init --depth 1 tools/kothic

      - name: Generate drawing rules
        shell: bash
        run: tools/unix/generate_drules.sh

      - name: Verify source and compiled InCar light palette
        shell: bash
        run: python3 -X dev -W default tools/ci/verify_in_car_light_palette.py

      - name: Commit canonical generated artefacts
        shell: bash
        run: |
          cp data/drules_in_car.bin android/sdk/src/main/assets/drules_in_car.bin
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/drules_in_car.bin \
            data/drules_in_car.txt \
            android/sdk/src/main/assets/drules_in_car.bin
          if git diff --cached --quiet; then
            echo "Generated artefacts are already current."
            exit 0
          fi
          git commit -m "Regenerate final InCar drawing rules"
          git push origin HEAD:fix/incar-high-glare-light-palette
