name: PR48 final source formatter

on:
  push:
    branches:
      - fix/incar-location-prompt-idempotency

permissions:
  contents: write

jobs:
  apply-format:
    if: github.event.head_commit.message == 'Format PR48 final source v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/incar-location-prompt-idempotency
          fetch-depth: 1
          fetch-tags: false

      - name: Apply exact clang-format deltas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          activity = Path('android/app/src/main/java/app/organicmaps/MwmActivity.java')
          text = activity.read_text()
          old = "  private void onLocationSettingsResult(@NonNull ActivityResult result)\n  {\n\n    mLocationPromptCoordinator.finishLocationSettingsTransition();\n"
          new = "  private void onLocationSettingsResult(@NonNull ActivityResult result)\n  {\n    mLocationPromptCoordinator.finishLocationSettingsTransition();\n"
          assert text.count(old) == 1, 'MwmActivity formatting target changed'
          activity.write_text(text.replace(old, new, 1))
          tests = Path('android/app/src/test/java/app/organicmaps/location/LocationPromptCoordinatorTest.java')
          text = tests.read_text()
          old = "    assertEquals(ProviderAction.SHOW_LOCATION_SETTINGS,\n                 coordinator.onProviderUnavailable(true, false, false));\n"
          new = "    assertEquals(ProviderAction.SHOW_LOCATION_SETTINGS, coordinator.onProviderUnavailable(true, false, false));\n"
          assert text.count(old) == 1, 'test formatting target changed'
          tests.write_text(text.replace(old, new, 1))
          Path('.github/workflows/pr48-format-once.yml').unlink()
          PY
          git diff --check
          git diff --stat

      - name: Commit final formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply final PR48 formatting'
          git push origin HEAD:fix/incar-location-prompt-idempotency
