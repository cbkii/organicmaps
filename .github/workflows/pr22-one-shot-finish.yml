name: PR22 one-shot finish

on:
  push:
    branches:
      - copilot/rework-incar-ui-navigation

permissions:
  contents: write

jobs:
  finish:
    if: github.event.head_commit.message == 'chore: run PR22 finish automation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install clang-format 22
        shell: bash
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 22
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-22 100
          clang-format --version

      - name: Apply final PR22 integration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one guarded replacement, found {count}")
              p.write_text(text.replace(old, new, 1))

          mwm = "android/app/src/main/java/app/organicmaps/MwmActivity.java"
          replace_once(
              mwm,
              "import app.organicmaps.incar.InCarRouterPolicy;\nimport app.organicmaps.incar.InCarSettingsStore;",
              "import app.organicmaps.incar.InCarBackPolicy;\nimport app.organicmaps.incar.InCarRouterPolicy;\nimport app.organicmaps.incar.InCarSettingsStore;",
          )
          replace_once(
              mwm,
              "    else if (RoutingController.get().hasSavedRoute())\n      RoutingController.get().restoreRoute();",
              "    else if (RoutingController.get().hasSavedRoute())\n    {\n      if (BuildConfig.IS_IN_CAR)\n      {\n        final Router restoreRouter =\n            InCarRouterPolicy.routerForNewDestination(InCarSettingsStore.isWalkingSessionActive(this));\n        RoutingController.get().restoreRoute(restoreRouter);\n      }\n      else\n        RoutingController.get().restoreRoute();\n    }\n    else if (BuildConfig.IS_IN_CAR)\n    {\n      // A walking session only has authority while a walking route is active/restorable. Do not let a\n      // process-death residue turn the next ordinary InCar destination into a pedestrian route.\n      InCarSettingsStore.setWalkingSessionActive(this, false);\n    }",
          )
          replace_once(
              mwm,
              "    case trackRecordingStatus -> toggleTrackRecordingPP();",
              "    case trackRecordingStatus -> onTrackRecordingOptionSelected();",
          )
          replace_once(
              mwm,
              "  /** @return true if the back press was consumed by closing an open panel, menu, or route. */\n  @Override\n  public boolean handleBackPress()\n  {\n    final RoutingController routingController = RoutingController.get();\n    return (closeBottomSheet(MAIN_MENU_ID) || closeBottomSheet(LAYERS_MENU_ID) || closeBottomSheet(ADVANCED_MENU_ID) || collapseNavMenu() || closePlacePage()\n            || closePositionChooser() || closeSearchFragment() || routingController.resetToPlanningStateIfNavigating()\n            || routingController.cancel());\n  }",
              "  /** @return true if the back press was consumed by closing an open panel, menu, or route. */\n  @Override\n  public boolean handleBackPress()\n  {\n    final RoutingController routingController = RoutingController.get();\n    if (closeBottomSheet(MAIN_MENU_ID) || closeBottomSheet(LAYERS_MENU_ID) || closeBottomSheet(ADVANCED_MENU_ID)\n        || collapseNavMenu() || closePlacePage() || closePositionChooser() || closeSearchFragment()\n        || closeInCarRouteEditor())\n      return true;\n\n    // InCar active navigation has a dedicated visible End control. Once transient UI is closed,\n    // Back is intentionally consumed here instead of falling through to reset/cancel routing.\n    if (BuildConfig.IS_IN_CAR && InCarBackPolicy.shouldBlockBackFromCancellingNavigation(routingController.isNavigating()))\n      return true;\n\n    return routingController.resetToPlanningStateIfNavigating() || routingController.cancel();\n  }",
          )
          replace_once(
              mwm,
              "  /**\n   * @return False if the position chooser was already closed, true otherwise\n   */\n  private boolean closePositionChooser()",
              "  private boolean closeInCarRouteEditor()\n  {\n    if (!BuildConfig.IS_IN_CAR)\n      return false;\n    final Fragment fragment = getSupportFragmentManager().findFragmentByTag(RoutingPlanFragment.TAG);\n    return fragment instanceof RoutingPlanFragment plan && plan.closeInCarRouteEditor();\n  }\n\n  /**\n   * @return False if the position chooser was already closed, true otherwise\n   */\n  private boolean closePositionChooser()",
          )

          old_menu = '''    if (id.equals(MAIN_MENU_ID))
    {
      ArrayList<MenuBottomSheetItem> items = new ArrayList<>();
      items.add(new MenuBottomSheetItem(R.string.placepage_add_place_button, R.drawable.ic_plus,
                                        this::onAddPlaceOptionSelected));
      items.add(new MenuBottomSheetItem(R.string.download_maps, R.drawable.ic_download, getDownloadMapsCounter(),
                                        this::onDownloadMapsOptionSelected));
      mDonatesUrl = Utils.getDonateUrl(getApplicationContext());
      // InCar: donate and other low-frequency items are in Advanced; non-InCar keeps them in primary menu.
      if (!BuildConfig.IS_IN_CAR && !TextUtils.isEmpty(mDonatesUrl))
        items.add(new MenuBottomSheetItem(R.string.donate, R.drawable.ic_donate, this::onDonateOptionSelected));
      items.add(new MenuBottomSheetItem(R.string.settings, R.drawable.ic_settings, this::onSettingsOptionSelected));
      items.add(new MenuBottomSheetItem(R.string.start_track_recording, R.drawable.ic_track_recording_off, -1,
                                        this::onTrackRecordingOptionSelected));
      items.add(new MenuBottomSheetItem(R.string.share_my_location, R.drawable.ic_share,
                                        this::onShareLocationOptionSelected));
      // InCar: Advanced submenu for low-frequency items (donate, etc.).
      if (BuildConfig.IS_IN_CAR)
        items.add(new MenuBottomSheetItem(R.string.in_car_advanced_menu_title, R.drawable.ic_settings,
                                          () -> showBottomSheet(ADVANCED_MENU_ID)));
      return items;
    }
    if (id.equals(ADVANCED_MENU_ID))
    {
      ArrayList<MenuBottomSheetItem> items = new ArrayList<>();
      mDonatesUrl = Utils.getDonateUrl(getApplicationContext());
      if (!TextUtils.isEmpty(mDonatesUrl))
        items.add(new MenuBottomSheetItem(R.string.donate, R.drawable.ic_donate, this::onDonateOptionSelected));
      return items;
    }
'''
          new_menu = '''    if (id.equals(MAIN_MENU_ID))
    {
      ArrayList<MenuBottomSheetItem> items = new ArrayList<>();
      items.add(new MenuBottomSheetItem(R.string.placepage_add_place_button, R.drawable.ic_plus,
                                        this::onAddPlaceOptionSelected));
      items.add(new MenuBottomSheetItem(R.string.download_maps, R.drawable.ic_download, getDownloadMapsCounter(),
                                        this::onDownloadMapsOptionSelected));

      if (BuildConfig.IS_IN_CAR)
      {
        // Keep the primary automotive menu task-oriented and stable. These entries reuse the existing
        // bookmark/layer/settings/share authorities rather than introducing InCar-specific copies.
        items.add(new MenuBottomSheetItem(R.string.bookmarks, R.drawable.ic_bookmarks_and_tracks, () -> {
          closeFloatingPanels();
          showBookmarks();
        }));
        items.add(new MenuBottomSheetItem(R.string.layers_title, R.drawable.ic_layers, () -> {
          closeFloatingPanels();
          showBottomSheet(LAYERS_MENU_ID);
        }));
        items.add(new MenuBottomSheetItem(R.string.settings, R.drawable.ic_settings, this::onSettingsOptionSelected));
        items.add(new MenuBottomSheetItem(R.string.share_my_location, R.drawable.ic_share,
                                          this::onShareLocationOptionSelected));
        items.add(new MenuBottomSheetItem(R.string.in_car_advanced_menu_title, R.drawable.ic_settings, () -> {
          closeBottomSheet(MAIN_MENU_ID);
          showBottomSheet(ADVANCED_MENU_ID);
        }));
        return items;
      }

      mDonatesUrl = Utils.getDonateUrl(getApplicationContext());
      if (!TextUtils.isEmpty(mDonatesUrl))
        items.add(new MenuBottomSheetItem(R.string.donate, R.drawable.ic_donate, this::onDonateOptionSelected));
      items.add(new MenuBottomSheetItem(R.string.settings, R.drawable.ic_settings, this::onSettingsOptionSelected));
      items.add(new MenuBottomSheetItem(R.string.start_track_recording, R.drawable.ic_track_recording_off, -1,
                                        this::onTrackRecordingOptionSelected));
      items.add(new MenuBottomSheetItem(R.string.share_my_location, R.drawable.ic_share,
                                        this::onShareLocationOptionSelected));
      return items;
    }
    if (id.equals(ADVANCED_MENU_ID))
    {
      ArrayList<MenuBottomSheetItem> items = new ArrayList<>();
      if (BuildConfig.IS_IN_CAR)
      {
        final int trackRecordingTitle = TrackRecorder.nativeIsTrackRecordingEnabled()
                                            ? R.string.track_recording_title
                                            : R.string.start_track_recording;
        items.add(new MenuBottomSheetItem(trackRecordingTitle, R.drawable.ic_track_recording_off, -1,
                                          this::onTrackRecordingOptionSelected));
      }
      mDonatesUrl = Utils.getDonateUrl(getApplicationContext());
      if (!TextUtils.isEmpty(mDonatesUrl))
        items.add(new MenuBottomSheetItem(R.string.donate, R.drawable.ic_donate, this::onDonateOptionSelected));
      return items;
    }
'''
          replace_once(mwm, old_menu, new_menu)

          plan = "android/app/src/main/java/app/organicmaps/routing/RoutingPlanFragment.java"
          replace_once(
              plan,
              "  public void onBuildStarted()\n  {\n    if (mRoutingBottomMenuController != null)\n      mRoutingBottomMenuController.resetBuildProgress();\n  }",
              "  public void onBuildStarted()\n  {\n    if (mRoutingBottomMenuController != null)\n      mRoutingBottomMenuController.resetBuildProgress();\n  }\n\n  /** Close the explicit InCar route-edit surface without cancelling route planning. */\n  public boolean closeInCarRouteEditor()\n  {\n    if (!BuildConfig.IS_IN_CAR || mRoutingBottomMenuController == null\n        || !mRoutingBottomMenuController.isManageRouteEditing())\n      return false;\n    mRoutingBottomMenuController.setManageRouteEditing(false);\n    updateSheetLayout();\n    return true;\n  }",
          )

          router = "android/app/src/main/java/app/organicmaps/incar/InCarRouterPolicy.java"
          replace_once(
              router,
              " * is only used when the user has explicitly activated a walking last-mile session via\n * {@link InCarWalkingSessionPolicy}. No other router type (Bicycle, Transit, Ruler) is ever",
              " * is only used when the user has explicitly activated a walking last-mile session recorded by\n * {@link InCarSettingsStore}. No other router type (Bicycle, Transit, Ruler) is ever",
          )

          Path("android/app/src/main/java/app/organicmaps/incar/InCarBackPolicy.java").write_text('''package app.organicmaps.incar;\n\n/** Pure guard used by the real map-screen Back path for fixed InCar navigation. */\npublic final class InCarBackPolicy\n{\n  private InCarBackPolicy() {}\n\n  /**\n   * Returns whether Back must be consumed after transient surfaces have already been closed.\n   * Active InCar navigation is ended only by the dedicated visible End Navigation control.\n   */\n  public static boolean shouldBlockBackFromCancellingNavigation(boolean navigating)\n  {\n    return navigating;\n  }\n}\n''')

          Path("android/app/src/test/java/app/organicmaps/incar/InCarBackPolicyTest.java").write_text('''package app.organicmaps.incar;\n\nimport static org.junit.Assert.assertFalse;\nimport static org.junit.Assert.assertTrue;\n\nimport org.junit.Test;\n\npublic class InCarBackPolicyTest\n{\n  @Test\n  public void activeNavigationBackIsBlockedFromCancellation()\n  {\n    assertTrue(InCarBackPolicy.shouldBlockBackFromCancellingNavigation(true));\n  }\n\n  @Test\n  public void nonNavigationBackFallsThrough()\n  {\n    assertFalse(InCarBackPolicy.shouldBlockBackFromCancellingNavigation(false));\n  }\n}\n''')
          PY

          git rm android/app/src/main/java/app/organicmaps/incar/InCarWalkingSessionPolicy.java
          git rm android/app/src/main/java/app/organicmaps/incar/InCarQuickDestinationsOrderPolicy.java
          git rm android/app/src/test/java/app/organicmaps/incar/InCarWalkingSessionPolicyTest.java
          git rm android/app/src/test/java/app/organicmaps/incar/InCarQuickDestinationsOrderPolicyTest.java

      - name: Format and push final integration
        shell: bash
        run: |
          tools/unix/clang-format.sh >/tmp/clang-format.diff 2>&1 || format_rc=$?
          if [ "${format_rc:-0}" -gt 1 ]; then
            cat /tmp/clang-format.diff
            exit "$format_rc"
          fi
          git diff --check
          git status --short
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finish InCar automotive UX integration"
          git push origin HEAD:copilot/rework-incar-ui-navigation
