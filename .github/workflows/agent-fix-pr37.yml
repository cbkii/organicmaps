name: Agent fix PR 37

on:
  push:
    branches:
      - ui/incar-refine-quick-chrome

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/incar-refine-quick-chrome
      - run: python3 .github/agent/pr37_patch.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/src/main/java/app/organicmaps/util/InCarVisuals.java android/app/src/test/java/app/organicmaps/util/InCarVisualsTest.java
          git diff --cached --check
          git commit -m 'fix(android): preserve InCar visual opt-out on tiny windows'
          git push origin HEAD:ui/incar-refine-quick-chrome
