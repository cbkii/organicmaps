name: PR14 macOS Software Smoke Patch

on:
  push:
    branches:
      - fix/in-car-startup-release-guard
    paths:
      - .github/workflows/pr14-macos-software-smoke-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'cbkii/organicmaps' && github.ref == 'refs/heads/fix/in-car-startup-release-guard'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: fix/in-car-startup-release-guard

      - name: Patch ARM smoke to macOS software acceleration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runner_old = '    runs-on: ubuntu-24.04-arm\n'
          runner_new = '    runs-on: macos-14\n'
          accel_old = '          target: default\n          disable-linux-hw-accel: true\n          emulator-boot-timeout: 900\n'
          accel_new = '          target: default\n          emulator-boot-timeout: 900\n          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off\n'

          def patch_section(path: str, marker: str) -> None:
              file = Path(path)
              text = file.read_text()
              if marker not in text:
                  raise SystemExit(f"{path}: section marker not found")
              before, section = text.split(marker, 1)
              if section.count(runner_old) != 1:
                  raise SystemExit(f"{path}: expected one ARM Linux runner in target section, found {section.count(runner_old)}")
              section = section.replace(runner_old, runner_new, 1)
              if section.count(accel_old) != 1:
                  raise SystemExit(f"{path}: expected one Linux software-emulation config in target section, found {section.count(accel_old)}")
              section = section.replace(accel_old, accel_new, 1)
              file.write_text(before + marker + section)

          patch_section('.github/workflows/android-check.yaml', '  in-car-release-smoke:\n')
          patch_section('.github/workflows/manual-in-car-release.yml', '  smoke:\n    name: Smoke signed InCarRelease on ARM64\n')
          PY

          git diff --check

      - name: Stage patched workflow blobs outside workflow paths
        shell: bash
        run: |
          mkdir -p .pr14-macos-smoke-staging
          cp .github/workflows/android-check.yaml .pr14-macos-smoke-staging/android-check.yaml
          cp .github/workflows/manual-in-car-release.yml .pr14-macos-smoke-staging/manual-in-car-release.yml
          git checkout -- .github/workflows/android-check.yaml .github/workflows/manual-in-car-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pr14-macos-smoke-staging/android-check.yaml .pr14-macos-smoke-staging/manual-in-car-release.yml
          git diff --cached --check
          git commit -m 'chore: stage macOS software ARM smoke workflow fix'
          git push origin HEAD:fix/in-car-startup-release-guard
