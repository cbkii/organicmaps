name: Fix auto-follow localisation placement

on:
  push:
    branches:
      - feature/auto-follow-location-launch
    paths:
      - .github/workflows/fix-auto-follow-localisation.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-follow-location-launch

      - name: Move strings into repository localisation surfaces
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "android/app/src/main/res/values/strings.xml",
              '    <string name="pref_map_auto_zoom">Auto zoom</string>\n',
              '    <string name="pref_map_auto_zoom">Auto zoom</string>\n'
              '    <string name="auto_follow_location_on_launch">Follow current location on launch</string>\n'
              '    <string name="auto_follow_location_on_launch_summary">Automatically start location tracking and orient the map to your direction when opened.</string>\n')

          replace_once(
              "android/app/src/main/res/values/donottranslate.xml",
              '  <string name="pref_auto_zoom" translatable="false">AutoZoom</string>\n',
              '  <string name="pref_auto_zoom" translatable="false">AutoZoom</string>\n'
              '  <string name="pref_auto_follow_location_on_launch" translatable="false">AutoStartLocationFollowAndRotate</string>\n')

          legacy = Path("android/app/src/main/res/values/strings_auto_follow_location.xml")
          if not legacy.exists():
              raise SystemExit(f"{legacy}: expected file is missing")
          legacy.unlink()

          Path(".github/workflows/fix-auto-follow-localisation.yml").unlink()

      - name: Validate patch
        run: |
          git diff --check
          test ! -e .github/workflows/fix-auto-follow-localisation.yml
          test ! -e android/app/src/main/res/values/strings_auto_follow_location.xml
          grep -q 'name="auto_follow_location_on_launch"' android/app/src/main/res/values/strings.xml
          grep -q 'name="pref_auto_follow_location_on_launch"' android/app/src/main/res/values/donottranslate.xml

      - name: Commit localisation fix
        run: |
          git config user.name "cbkii"
          git config user.email "150587541+cbkii@users.noreply.github.com"
          git add -A
          git commit -s -m "[android] Align launch follow strings with localisation"
          git push origin HEAD:feature/auto-follow-location-launch
