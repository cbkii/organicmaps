name: Android Check
on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - master
  pull_request:
    paths-ignore:
      - .gitignore
      - .github/**
      - '!.github/workflows/android-check.yaml'  # Run check on self change
      - '**/*_tests/**'
      - CONTRIBUTORS
      - LICENSE
      - NOTICE
      - README.md
      - android/app/src/fdroid/**
      - android/app/src/google/**
      - data/organic_maps_emoji/**
      - data/strings/**
      - docs/**
      - generator/**
      - platform/*apple*
      - platform/*_ios*
      - platform/*_linux*
      - platform/*_mac*
      - platform/*qt*
      - platform/*_win*
      - skin_generator/**
      - tools/**
      - track_generator/**

jobs:
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64  # Java 17 is required for Android Gradle 8 plugin
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Verify InCar chrome contrast
        shell: bash
        run: |
          python3 -m py_compile android/tools/verify_in_car_contrast.py
          python3 android/tools/verify_in_car_contrast.py

      - name: Verify offline navigation voice pack source
        shell: bash
        run: |
          python3 -m py_compile android/tools/verify_offline_navigation_voice_pack.py
          python3 android/tools/verify_offline_navigation_voice_pack.py \
            --asset-root android/app/src/inCar/assets

      - name: Verify InCar engineering tools
        shell: bash
        run: |
          python3 -m py_compile \
            android/tools/report_in_car_apk_metrics.py \
            android/tools/capture_in_car_runtime_baseline.py \
            android/tools/tests/test_report_in_car_apk_metrics.py
          python3 -m unittest discover \
            -s android/tools/tests \
            -p 'test_report_in_car_apk_metrics.py'
          bash -n android/tools/smoke_test_in_car_warm_reentry.sh

      # Keep repository-wide lint as a shared-code quality gate. Web/F-Droid
      # build and publication lanes are intentionally not CI release gates.
      - name: Lint
        shell: bash
        working-directory: android
        run: ./gradlew lintAllModules

      - name: Install reviewdog
        uses: reviewdog/action-setup@v1

      - name: Report Android Lint Results
        uses: ilyagulya/android-lint-action@v0.12.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          lint_xml_file: android/build/reports/lint/lint.xml
          reporter: github-check
          level: warning
          reviewdog_flags: '-filter-mode=nofilter'

      - name: Upload Android Lint Report
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: android/build/reports/lint/lint.xml
          retention-days: 30

  android-check:
    name: Build Android Debug (InCarProfileable)
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      CI_IN_CAR_RELEASE_VERSION: '0.0.0'
      CI_IN_CAR_RELEASE_VERSION_CODE: '1000000000'
    # Cancels previous jobs if the same branch or PR was updated again.
    # Only cancel PR runs: master runs must finish to populate the shared ccache.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Install build tools and dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build

      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          # Needed for versioning script.
          fetch-depth: 200

      - name: Cache Boost submodule
        uses: ./.github/actions/cache-boost

      - name: Parallel submodules checkout
        shell: bash
        run: git submodule update --depth 1 --init --recursive --jobs=$(($(nproc) * 20))

      - name: Configure repository
        shell: bash
        run: ./configure.sh

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.workflow }}-InCarProfileable
          # Restore-only on PRs: master populates the shared cache, PRs read it.
          save: ${{ github.ref == 'refs/heads/master' }}

      - name: Compile InCarProfileable
        shell: bash
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cmake --version
          ninja --version
          ./gradlew -Parm64 assembleInCarProfileable

      - name: Verify InCarProfileable package
        shell: bash
        run: |
          proof_dir="${RUNNER_TEMP}/in-car-package-proof"
          mkdir -p "${proof_dir}"

          mapfile -t in_car_apks < <(find android/app/build/outputs/apk/inCar/profileable -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [[ "${#in_car_apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one InCarProfileable APK; found ${#in_car_apks[@]}."
            printf 'in-car: %s\n' "${in_car_apks[*]:-none}"
            exit 1
          fi

          bash android/tools/verify_in_car_apk.sh \
            --apk "${in_car_apks[0]}" \
            --expected-package app.organicmaps.incar.profileable \
            --proof-dir "${proof_dir}" \
            --summary-file "${GITHUB_STEP_SUMMARY}"
          python3 android/tools/verify_offline_navigation_voice_pack.py \
            --apk "${in_car_apks[0]}"

      - name: Upload InCarProfileable APK
        uses: actions/upload-artifact@v7
        with:
          name: android-InCarProfileable
          path: android/app/build/outputs/apk/inCar/profileable/OrganicMaps-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build x86_64 InCarDebug tests and InCarProfileable smoke APK
        shell: bash
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./gradlew -Px86_64 assembleInCarDebug assembleInCarProfileable

      - name: Run InCar and SDK unit tests
        shell: bash
        working-directory: android
        run: ./gradlew -Px86_64 app:testInCarDebug sdk:testDebug

      - name: Upload x86_64 InCarProfileable smoke APK
        uses: actions/upload-artifact@v7
        with:
          name: android-InCarProfileable-x86_64-ci
          path: android/app/build/outputs/apk/inCar/profileable/OrganicMaps-*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Free disk space for SDK emulator tests
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null

      - name: Enable KVM for SDK emulator tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run SDK connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: cd android && ./gradlew -Px86_64 sdk:connectedDebugAndroidTest

      - name: Configure CI release signing
        id: ci_release_signing
        shell: bash
        run: |
          keystore="${RUNNER_TEMP}/in-car-ci-release.keystore"
          store_password='organicmaps-ci'
          alias_name='organicmaps-ci'
          key_password='organicmaps-ci'

          if ! keytool -genkeypair -noprompt \
              -keystore "${keystore}" \
              -storepass "${store_password}" \
              -keypass "${key_password}" \
              -alias "${alias_name}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1 \
              -dname 'CN=Organic Maps In-Car CI, OU=CI, O=Organic Maps, L=CI, ST=CI, C=AU'; then
            echo "::error::Unable to create the ephemeral InCarRelease CI signing key."
            exit 1
          fi
          chmod 600 "${keystore}"

          keytool_output="${RUNNER_TEMP}/in-car-ci-keytool.txt"
          if ! keytool -list -v \
              -keystore "${keystore}" \
              -alias "${alias_name}" \
              -storepass "${store_password}" > "${keytool_output}" 2>&1; then
            echo "::error::Unable to inspect the ephemeral InCarRelease CI signing key."
            exit 1
          fi
          cert_sha256="$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' "${keytool_output}" | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "${cert_sha256}" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::Unable to resolve the ephemeral InCarRelease CI signer fingerprint."
            exit 1
          fi

          : > android/app/secure.properties
          echo "keystore=${keystore}" >> "${GITHUB_OUTPUT}"
          echo "store_password=${store_password}" >> "${GITHUB_OUTPUT}"
          echo "alias=${alias_name}" >> "${GITHUB_OUTPUT}"
          echo "key_password=${key_password}" >> "${GITHUB_OUTPUT}"
          echo "cert_sha256=${cert_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Build release-equivalent arm64 InCarRelease
        shell: bash
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          KEYSTORE_PATH: ${{ steps.ci_release_signing.outputs.keystore }}
          KEYSTORE_PASSWORD: ${{ steps.ci_release_signing.outputs.store_password }}
          KEY_ALIAS: ${{ steps.ci_release_signing.outputs.alias }}
          KEY_PASSWORD: ${{ steps.ci_release_signing.outputs.key_password }}
        run: |
          export ORG_GRADLE_PROJECT_spropStoreFile="${KEYSTORE_PATH}"
          export ORG_GRADLE_PROJECT_spropStorePassword="${KEYSTORE_PASSWORD}"
          export ORG_GRADLE_PROJECT_spropKeyAlias="${KEY_ALIAS}"
          export ORG_GRADLE_PROJECT_spropKeyPassword="${KEY_PASSWORD}"
          ./gradlew --no-daemon --stacktrace \
            -Parm64 \
            -PinCarReleaseVersionName="${CI_IN_CAR_RELEASE_VERSION}" \
            -PinCarReleaseVersionCode="${CI_IN_CAR_RELEASE_VERSION_CODE}" \
            assembleInCarRelease

      - name: Verify release-equivalent InCarRelease
        shell: bash
        run: |
          proof_dir="${RUNNER_TEMP}/in-car-release-ci-proof"
          mkdir -p "${proof_dir}"
          mapfile -t release_apks < <(find android/app/build/outputs/apk/inCar/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [[ "${#release_apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one release-equivalent InCarRelease APK; found ${#release_apks[@]}."
            printf '%s\n' "${release_apks[@]:-}"
            exit 1
          fi

          bash android/tools/verify_in_car_apk.sh \
            --apk "${release_apks[0]}" \
            --expected-package app.organicmaps.incar \
            --expected-version-name "${CI_IN_CAR_RELEASE_VERSION}-InCar" \
            --expected-version-code "${CI_IN_CAR_RELEASE_VERSION_CODE}" \
            --expected-cert-sha256 "${{ steps.ci_release_signing.outputs.cert_sha256 }}" \
            --proof-dir "${proof_dir}" \
            --summary-file "${GITHUB_STEP_SUMMARY}"
          python3 android/tools/verify_offline_navigation_voice_pack.py \
            --apk "${release_apks[0]}"
          python3 android/tools/report_in_car_apk_metrics.py \
            --apk "${release_apks[0]}" \
            --output-json "${RUNNER_TEMP}/in-car-release-ci-metrics.json" \
            --summary-file "${GITHUB_STEP_SUMMARY}" > /dev/null

      - name: Upload release-equivalent InCarRelease APK
        uses: actions/upload-artifact@v7
        with:
          name: android-InCarRelease-ci
          path: android/app/build/outputs/apk/inCar/release/OrganicMaps-*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Stage release diagnostics
        id: release_diagnostics
        shell: bash
        run: |
          set -euo pipefail

          diagnostics_dir="${RUNNER_TEMP}/in-car-release-ci-diagnostics"
          symbols="android/app/build/outputs/native-debug-symbols/inCarRelease/native-debug-symbols.zip"
          mapping="android/app/build/outputs/mapping/inCarRelease/mapping.txt"
          metrics="${RUNNER_TEMP}/in-car-release-ci-metrics.json"
          if [[ ! -f "${symbols}" || ! -f "${mapping}" || ! -f "${metrics}" ]]; then
            echo "::error::Expected InCarRelease native symbols, R8 mapping and APK metrics were not produced."
            exit 1
          fi
          mkdir -p "${diagnostics_dir}"
          cp "${symbols}" "${diagnostics_dir}/native-debug-symbols.zip"
          cp "${mapping}" "${diagnostics_dir}/mapping.txt"
          cp "${metrics}" "${diagnostics_dir}/apk-metrics.json"
          echo "path=${diagnostics_dir}" >> "${GITHUB_OUTPUT}"

      - name: Upload release diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: android-InCarRelease-ci-diagnostics
          path: ${{ steps.release_diagnostics.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove CI release signing material
        if: always()
        shell: bash
        run: |
          rm -f \
            android/app/secure.properties \
            "${RUNNER_TEMP}/in-car-ci-release.keystore" \
            "${RUNNER_TEMP}/in-car-ci-keytool.txt"

  in-car-release-smoke:
    name: Smoke InCarProfileable on API ${{ matrix.api-level }} x86_64
    needs: android-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 30]

    steps:
      - name: Checkout smoke scripts
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download x86_64 InCarProfileable APK
        uses: actions/download-artifact@v7
        with:
          name: android-InCarProfileable-x86_64-ci
          path: ${{ runner.temp }}/in-car-profileable-ci

      - name: Resolve x86_64 InCarProfileable APK
        id: apk
        shell: bash
        run: |
          apk_count="$(find "${RUNNER_TEMP}/in-car-profileable-ci" -type f -name '*.apk' | wc -l | tr -d ' ')"
          if [[ "${apk_count}" -ne 1 ]]; then
            echo "::error::Expected exactly one x86_64 InCarProfileable APK; found ${apk_count}."
            exit 1
          fi
          apk_path="$(find "${RUNNER_TEMP}/in-car-profileable-ci" -type f -name '*.apk' -print -quit)"
          echo "path=${apk_path}" >> "${GITHUB_OUTPUT}"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke optimised InCar cold launch, warm re-entry and window resize
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          script: |
            bash android/tools/smoke_test_in_car_apk.sh --apk "${{ steps.apk.outputs.path }}" --package app.organicmaps.incar.profileable --proof-dir "${RUNNER_TEMP}/in-car-profileable-ci-launch-smoke-api-${{ matrix.api-level }}"
            bash android/tools/smoke_test_in_car_warm_reentry.sh --package app.organicmaps.incar.profileable --proof-dir "${RUNNER_TEMP}/in-car-profileable-ci-launch-smoke-api-${{ matrix.api-level }}/warm-reentry"
            bash android/tools/smoke_test_in_car_window_resize.sh --package app.organicmaps.incar.profileable --proof-dir "${RUNNER_TEMP}/in-car-profileable-ci-launch-smoke-api-${{ matrix.api-level }}/window-resize"

      - name: Upload optimised InCar launch smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-InCarProfileable-x86_64-launch-smoke-api-${{ matrix.api-level }}
          path: ${{ runner.temp }}/in-car-profileable-ci-launch-smoke-api-${{ matrix.api-level }}
          if-no-files-found: warn
          retention-days: 90
