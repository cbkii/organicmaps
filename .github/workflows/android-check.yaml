name: Android Check
on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - master
  pull_request:
    paths-ignore:
      - .gitignore
      - .github/**
      - '!.github/workflows/android-check.yaml'  # Run check on self change
      - '**/*_tests/**'
      - CONTRIBUTORS
      - LICENSE
      - NOTICE
      - README.md
      - android/app/src/fdroid/**
      - android/app/src/google/**
      - iphone/**
      - data/organic_maps_emoji/**
      - data/strings/**
      - docs/**
      - generator/**
      - packaging/**
      - platform/*apple*
      - platform/*_ios*
      - platform/*_linux*
      - platform/*_mac*
      - platform/*qt*
      - platform/*_win*
      - qt*/**
      - skin_generator/**
      - tools/**
      - track_generator/**

env:
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64  # Java 17 is required for Android Gradle 8 plugin

jobs:
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Lint
        shell: bash
        working-directory: android
        run: ./gradlew lintAllModules

      # Reviewdog is needed for the action below to report issues in the PR.
      - name: Install reviewdog
        uses: reviewdog/action-setup@v1

      - name: Report Android Lint Results
        uses: ilyagulya/android-lint-action@v0.12.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          lint_xml_file: android/build/reports/lint/lint.xml
          reporter: github-pr-review
          level: warning

      - name: Upload Android Lint Report
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: android/build/reports/lint/lint.xml
          retention-days: 30

  android-check:
    name: Build Android Debug
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [WebDebug, FdroidDebug, InCarProfileable]
        include:
          - flavor: WebDebug
            arch: arm64
            run-tests: true
            verify_in_car: false
            artifact_path: android/app/build/outputs/apk/web/debug/OrganicMaps-*.apk
          - flavor: FdroidDebug
            arch: arm32
            verify_in_car: false
            artifact_path: android/app/build/outputs/apk/fdroid/debug/OrganicMaps-*.apk
          - flavor: InCarProfileable
            arch: arm64
            verify_in_car: true
            artifact_path: android/app/build/outputs/apk/inCar/profileable/OrganicMaps-*.apk
    # Cancels previous jobs if the same branch or PR was updated again.
    # Only cancel PR runs: master runs must finish to populate the shared ccache.
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.flavor }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Install build tools and dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build

      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          # Needed for versioning script
          fetch-depth: 200 # enough to get all commits for the current day

      - name: Cache Boost submodule
        uses: ./.github/actions/cache-boost

      - name: Parallel submodules checkout
        shell: bash
        run: git submodule update --depth 1 --init --recursive --jobs=$(($(nproc) * 20))

      - name: Configure repository
        shell: bash
        run: ./configure.sh

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.workflow }}-${{ matrix.flavor }}
          # Restore-only on PRs: master populates the shared cache, PRs read it.
          # Avoids overflowing the 10GB repo limit, which evicts master's caches.
          save: ${{ github.ref == 'refs/heads/master' }}

      - name: Compile ${{ matrix.flavor }}
        shell: bash
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cmake --version
          ninja --version
          ./gradlew -P${{ matrix.arch }} assemble${{ matrix.flavor }}

      - name: Build arm64 FdroidProfileable comparison
        if: matrix.verify_in_car == true
        shell: bash
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./gradlew -Parm64 assembleFdroidProfileable

      - name: Verify in-car package and comparison
        if: matrix.verify_in_car == true
        shell: bash
        run: |
          proof_dir="${RUNNER_TEMP}/in-car-package-proof"
          rm -rf "${proof_dir}"
          if ! mkdir -p "${proof_dir}"; then
            echo "::error::Unable to create in-car package proof directory."
            exit 1
          fi

          in_car_unsorted="${proof_dir}/in-car-apks-unsorted.txt"
          in_car_list="${proof_dir}/in-car-apks.txt"
          reference_unsorted="${proof_dir}/reference-apks-unsorted.txt"
          reference_list="${proof_dir}/reference-apks.txt"
          if ! find android/app/build/outputs/apk/inCar/profileable -maxdepth 1 -type f -name '*.apk' -print > "${in_car_unsorted}"; then
            echo "::error::Unable to enumerate InCarProfileable APKs."
            exit 1
          fi
          if ! sort "${in_car_unsorted}" > "${in_car_list}"; then
            echo "::error::Unable to sort InCarProfileable APK candidates."
            exit 1
          fi
          if ! find android/app/build/outputs/apk/fdroid/profileable -maxdepth 1 -type f -name '*.apk' -print > "${reference_unsorted}"; then
            echo "::error::Unable to enumerate FdroidProfileable APKs."
            exit 1
          fi
          if ! sort "${reference_unsorted}" > "${reference_list}"; then
            echo "::error::Unable to sort FdroidProfileable APK candidates."
            exit 1
          fi

          mapfile -t in_car_apks < "${in_car_list}"
          mapfile -t reference_apks < "${reference_list}"
          if [[ "${#in_car_apks[@]}" -ne 1 || "${#reference_apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one InCarProfileable and one FdroidProfileable APK."
            printf 'in-car: %s\n' "${in_car_apks[*]:-none}"
            printf 'reference: %s\n' "${reference_apks[*]:-none}"
            exit 1
          fi

          in_car_apk="${in_car_apks[0]}"
          reference_apk="${reference_apks[0]}"
          manifest="${proof_dir}/in-car-manifest.xml"
          zip_list="${proof_dir}/in-car-zip-list.txt"
          dex_entries_file="${proof_dir}/dex-entries.txt"
          dex_strings="${proof_dir}/in-car-dex-strings.txt"
          abi_unsorted="${proof_dir}/abis-unsorted.txt"
          abi_list="${proof_dir}/abis.txt"

          apkanalyzer="$(command -v apkanalyzer || true)"
          if [[ -z "${apkanalyzer}" ]]; then
            apkanalyzer_candidates="${proof_dir}/apkanalyzer-candidates.txt"
            apkanalyzer_sorted="${proof_dir}/apkanalyzer-candidates-sorted.txt"
            if find "${ANDROID_HOME}/cmdline-tools" -type f -name apkanalyzer -perm -u+x -print > "${apkanalyzer_candidates}" 2>/dev/null; then
              if sort -V "${apkanalyzer_candidates}" > "${apkanalyzer_sorted}"; then
                apkanalyzer="$(tail -n1 "${apkanalyzer_sorted}")"
              fi
            fi
          fi
          if [[ -z "${apkanalyzer}" ]]; then
            echo "::error::apkanalyzer was not found in PATH or the Android SDK."
            exit 1
          fi

          if ! "${apkanalyzer}" manifest print "${in_car_apk}" > "${manifest}"; then
            echo "::error::Unable to decode the InCarProfileable manifest."
            exit 1
          fi
          if ! unzip -Z1 "${in_car_apk}" > "${zip_list}"; then
            echo "::error::Unable to enumerate InCarProfileable APK entries."
            exit 1
          fi
          grep -E '^classes([0-9]+)?\.dex$' "${zip_list}" > "${dex_entries_file}" || true
          mapfile -t dex_entries < "${dex_entries_file}"
          if [[ "${#dex_entries[@]}" -eq 0 ]]; then
            echo "::error::No classes*.dex entries were found in InCarProfileable APK."
            exit 1
          fi
          : > "${dex_strings}"
          for dex_entry in "${dex_entries[@]}"; do
            dex_file="${proof_dir}/$(basename "${dex_entry}")"
            if ! unzip -p "${in_car_apk}" "${dex_entry}" > "${dex_file}"; then
              echo "::error::Unable to extract ${dex_entry} from InCarProfileable APK."
              exit 1
            fi
            if ! strings "${dex_file}" >> "${dex_strings}"; then
              echo "::error::Unable to inspect ${dex_entry} strings."
              exit 1
            fi
          done

          forbidden_manifest=(
            'app.organicmaps.car.AndroidAutoService'
            'androidx.car.app.NAVIGATION_TEMPLATES'
            'androidx.car.app.ACCESS_SURFACE'
            'app.organicmaps.editor.EditorActivity'
            'app.organicmaps.editor.ProfileActivity'
            'app.organicmaps.editor.FeatureCategoryActivity'
            'app.organicmaps.editor.ReportActivity'
            'app.organicmaps.editor.OsmLoginActivity'
          )
          for needle in "${forbidden_manifest[@]}"; do
            if grep -Fq -- "${needle}" "${manifest}"; then
              echo "::error::Forbidden in-car manifest entry remains: ${needle}"
              exit 1
            fi
          done

          required_manifest=(
            'app.organicmaps.location.TrackRecordingService'
            'app.organicmaps.DownloadResourcesActivity'
          )
          for needle in "${required_manifest[@]}"; do
            if ! grep -Fq -- "${needle}" "${manifest}"; then
              echo "::error::Required in-car manifest entry is missing: ${needle}"
              exit 1
            fi
          done

          # Editor implementation can remain linked as an accepted residual; its in-car
          # safety boundary is that editor Activities are absent from the manifest and
          # entry paths are product-gated. Keep bytecode-absence checks for integrations
          # that are intended to be physically absent from the in-car runtime graph.
          forbidden_dex=(
            'Lapp/organicmaps/car/'
            'Landroidx/car/app/'
            'Lapp/organicmaps/intent/GoogleAssistantIntentBridge;'
            'Landroidx/work/'
          )
          for needle in "${forbidden_dex[@]}"; do
            if grep -Fq -- "${needle}" "${dex_strings}"; then
              echo "::error::Forbidden in-car runtime class/package remains: ${needle}"
              exit 1
            fi
          done

          required_dex=(
            'Lapp/organicmaps/location/TrackRecordingService;'
            'Lapp/organicmaps/downloader/'
            'Lcom/github/mikephil/charting/'
          )
          for needle in "${required_dex[@]}"; do
            if ! grep -Fq -- "${needle}" "${dex_strings}"; then
              echo "::error::Required in-car runtime package/class is missing: ${needle}"
              exit 1
            fi
          done

          if ! sed -n 's#^lib/\([^/]*\)/.*#\1#p' "${zip_list}" > "${abi_unsorted}"; then
            echo "::error::Unable to extract ABI entries from InCarProfileable APK."
            exit 1
          fi
          if ! sort -u "${abi_unsorted}" > "${abi_list}"; then
            echo "::error::Unable to normalise InCarProfileable ABI entries."
            exit 1
          fi
          mapfile -t abis < "${abi_list}"
          if [[ "${#abis[@]}" -ne 1 || "${abis[0]}" != 'arm64-v8a' ]]; then
            echo "::error::Expected arm64-v8a-only InCarProfileable APK; found: ${abis[*]:-none}"
            exit 1
          fi

          in_car_size="$(stat -c '%s' "${in_car_apk}")"
          reference_size="$(stat -c '%s' "${reference_apk}")"
          delta="$((in_car_size - reference_size))"
          {
            echo '### In-car package proof'
            echo
            echo "- InCarProfileable bytes: \`${in_car_size}\`"
            echo "- FdroidProfileable bytes: \`${reference_size}\`"
            echo "- In-car minus reference: \`${delta}\` bytes"
            echo '- ABI: `arm64-v8a` only'
            echo '- Android Auto manifest/runtime: absent'
            echo '- Google Assistant bridge/runtime: absent'
            echo '- WorkManager runtime: absent'
            echo '- OSM editor Activity manifest surface: absent'
            echo '- Track Recording: present'
            echo '- Downloader: present'
            echo '- MPAndroidChart/elevation chart runtime: present'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Compile Wear Google Debug
        if: matrix.flavor == 'WebDebug'
        shell: bash
        working-directory: android
        run: ./gradlew :wear:assembleGoogleDebug

      - name: Free disk space for emulator
        if: matrix.run-tests == true
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null

      - name: Enable KVM
        if: matrix.run-tests == true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests
        if: matrix.run-tests == true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            cd android && ./gradlew -P${{ matrix.arch }} app:test${{ matrix.flavor }} sdk:testDebug sdk:connectedDebugAndroidTest

      - name: Upload ${{ matrix.flavor }} apk
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.flavor }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30
