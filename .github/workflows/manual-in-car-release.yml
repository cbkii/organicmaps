name: Manual In-Car Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump when version is blank'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: 'Optional MAJOR.MINOR.PATCH. Date-style 2026.08.09 is accepted and normalised; leave blank to auto-bump.'
        required: false
        type: string
      draft:
        description: 'Leave the verified GitHub release as a draft'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: manual-in-car-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and stage InCarRelease
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: release
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 200
          fetch-tags: true

      - name: Validate release branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          default_branch="$(gh repo view "${GITHUB_REPOSITORY}" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "${default_branch}" ]]; then
            echo "::error::In-car releases must run from the repository default branch (${default_branch}); selected ref is ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}."
            exit 1
          fi
          echo "Release source: ${GITHUB_SHA}"

      - name: Resolve in-car version
        id: version
        shell: bash
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          latest="$(
            git tag --list 'in-car-v*' \
              | grep -E '^in-car-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
              | sort -V \
              | tail -n1 \
              || true
          )"

          if ! resolution="$(
            python3 android/tools/resolve_in_car_release_version.py \
              --latest-tag "${latest}" \
              --requested "${INPUT_VERSION}" \
              --bump "${INPUT_BUMP}"
          )"; then
            echo "::error::Unable to resolve the requested in-car release version."
            exit 1
          fi

          version=""
          version_code=""
          version_name=""
          tag=""
          previous_tag=""
          while IFS='=' read -r key value; do
            case "${key}" in
              version) version="${value}" ;;
              version_code) version_code="${value}" ;;
              version_name) version_name="${value}" ;;
              tag) tag="${value}" ;;
              previous_tag) previous_tag="${value}" ;;
              *)
                echo "::error::Unexpected version resolver output key '${key}'."
                exit 1
                ;;
            esac
          done <<< "${resolution}"

          if [[ -z "${version}" || -z "${version_code}" || -z "${version_name}" || -z "${tag}" ]]; then
            echo "::error::Version resolver returned incomplete output."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Git tag '${tag}' already exists."
            exit 1
          fi
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::GitHub release '${tag}' already exists."
            exit 1
          fi
          if [[ -n "${previous_tag}" ]] && ! gh release view "${previous_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Previous in-car tag ${previous_tag} has no readable GitHub release."
            exit 1
          fi

          requested="$(printf '%s' "${INPUT_VERSION}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          requested="${requested#in-car-v}"
          requested="${requested#v}"
          if [[ -n "${requested}" && "${requested}" != "${version}" ]]; then
            echo "::notice::Normalised explicit in-car version '${INPUT_VERSION}' to '${version}'."
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "version_name=${version_name}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "previous_tag=${previous_tag}" >> "${GITHUB_OUTPUT}"

          echo "Resolved in-car release: ${tag}"
          echo "Android versionCode: ${version_code}"
          echo "Android versionName: ${version_name}"

      - name: Validate release secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "${KEYSTORE_BASE64}" ]] || missing+=(KEYSTORE_BASE64)
          [[ -n "${KEYSTORE_PASSWORD}" ]] || missing+=(KEYSTORE_PASSWORD)
          [[ -n "${KEY_ALIAS}" ]] || missing+=(KEY_ALIAS)
          [[ -n "${KEY_PASSWORD}" ]] || missing+=(KEY_PASSWORD)
          if [[ "${#missing[@]}" -ne 0 ]]; then
            echo "::error::Missing required release signing secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ninja-build

      - name: Initialise submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --depth 1 --init --recursive --jobs="$(($(nproc) * 20))"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Organic Maps Android build tools
        shell: bash
        run: |
          set -euo pipefail

          compile_sdk="$(sed -n 's/^propCompileSdkVersion=//p' android/gradle.properties | head -n1)"
          ndk_version="$(sed -n 's/^propNdkVersion=//p' android/gradle.properties | head -n1)"
          build_tools_version="36.0.0"
          cmake_version="3.22.1"

          if [[ ! "${compile_sdk}" =~ ^[0-9]+$ ]] || [[ -z "${ndk_version}" ]]; then
            echo "::error::Unable to resolve compile SDK / NDK versions from android/gradle.properties."
            exit 1
          fi

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${compile_sdk}" \
            "build-tools;${build_tools_version}" \
            "cmake;${cmake_version}" \
            "ndk;${ndk_version}"

          build_tools_dir="${ANDROID_HOME}/build-tools/${build_tools_version}"
          if [[ ! -x "${build_tools_dir}/apksigner" ]]; then
            echo "::error::Expected apksigner is missing: ${build_tools_dir}/apksigner"
            exit 1
          fi

          apkanalyzer="$(command -v apkanalyzer || true)"
          if [[ -z "${apkanalyzer}" ]]; then
            apkanalyzer="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name apkanalyzer -perm -u+x -print 2>/dev/null | sort -V | tail -n1)"
          fi
          if [[ -z "${apkanalyzer}" || ! -x "${apkanalyzer}" ]]; then
            echo "::error::apkanalyzer was not found in the configured Android SDK."
            exit 1
          fi

          echo "${ANDROID_HOME}/cmake/${cmake_version}/bin" >> "${GITHUB_PATH}"
          echo "${build_tools_dir}" >> "${GITHUB_PATH}"
          echo "ANDROID_BUILD_TOOLS_DIR=${build_tools_dir}" >> "${GITHUB_ENV}"
          echo "APKANALYZER_BIN=${apkanalyzer}" >> "${GITHUB_ENV}"
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > android/local.properties

      - name: Configure Organic Maps
        shell: bash
        run: bash ./configure.sh

      - name: Configure release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          keystore="${RUNNER_TEMP}/organicmaps-in-car-release.keystore"
          if ! printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"; then
            echo "::error::KEYSTORE_BASE64 could not be decoded."
            exit 1
          fi
          chmod 600 "${keystore}"

          keytool_output="${RUNNER_TEMP}/in-car-keytool.txt"
          if ! keytool -list -v \
              -keystore "${keystore}" \
              -alias "${KEY_ALIAS}" \
              -storepass "${KEYSTORE_PASSWORD}" > "${keytool_output}" 2>&1; then
            echo "::error::Unable to open the configured release keystore/alias."
            exit 1
          fi

          cert_sha256="$(
            sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' "${keytool_output}" \
              | head -n1 \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )"
          if [[ ! "${cert_sha256}" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::Unable to resolve the release certificate SHA-256 fingerprint."
            exit 1
          fi

          : > android/app/secure.properties
          echo "keystore=${keystore}" >> "${GITHUB_OUTPUT}"
          echo "cert_sha256=${cert_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Build signed arm64 InCarRelease APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail

          export ORG_GRADLE_PROJECT_spropStoreFile="${KEYSTORE_PATH}"
          export ORG_GRADLE_PROJECT_spropStorePassword="${KEYSTORE_PASSWORD}"
          export ORG_GRADLE_PROJECT_spropKeyAlias="${KEY_ALIAS}"
          export ORG_GRADLE_PROJECT_spropKeyPassword="${KEY_PASSWORD}"

          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            -Parm64 \
            -PinCarReleaseVersionName="${RELEASE_VERSION}" \
            -PinCarReleaseVersionCode="${RELEASE_VERSION_CODE}" \
            assembleInCarRelease
          rm -f app/secure.properties

      - name: Verify release APK and prepare assets
        id: apk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          EXPECTED_CERT_SHA256: ${{ steps.signing.outputs.cert_sha256 }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail

          output_dir="android/app/build/outputs/apk/inCar/release"
          proof_dir="${RUNNER_TEMP}/in-car-release-proof"
          mkdir -p "${proof_dir}"

          mapfile -t apks < <(find "${output_dir}" -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one InCarRelease APK in ${output_dir}, found ${#apks[@]}."
            printf '%s\n' "${apks[@]:-}"
            exit 1
          fi

          apk_name="OrganicMaps-InCar-v${RELEASE_VERSION}-arm64-v8a.apk"
          apk_path="${RUNNER_TEMP}/${apk_name}"
          cp "${apks[0]}" "${apk_path}"

          bash android/tools/verify_in_car_apk.sh \
            --apk "${apk_path}" \
            --expected-package app.organicmaps.incar \
            --expected-version-name "${EXPECTED_VERSION_NAME}" \
            --expected-version-code "${EXPECTED_VERSION_CODE}" \
            --expected-cert-sha256 "${EXPECTED_CERT_SHA256}" \
            --proof-dir "${proof_dir}" \
            --summary-file "${GITHUB_STEP_SUMMARY}"

          if [[ -n "${PREVIOUS_TAG}" ]]; then
            previous_dir="${proof_dir}/previous"
            mkdir -p "${previous_dir}"
            if ! gh release download "${PREVIOUS_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --pattern 'OrganicMaps-InCar-v*-arm64-v8a.apk' \
                --dir "${previous_dir}"; then
              echo "::error::Unable to download the previous in-car release APK from ${PREVIOUS_TAG}."
              exit 1
            fi
            mapfile -t previous_apks < <(find "${previous_dir}" -maxdepth 1 -type f -name '*.apk' -print | sort)
            if [[ "${#previous_apks[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one previous in-car APK for signer continuity; found ${#previous_apks[@]}."
              exit 1
            fi

            bash android/tools/verify_in_car_apk.sh \
              --apk "${previous_apks[0]}" \
              --expected-cert-sha256 "${EXPECTED_CERT_SHA256}" \
              --proof-dir "${previous_dir}/signer-proof" \
              --signature-only
            echo "- Signer continuity with \`${PREVIOUS_TAG}\`: verified" >> "${GITHUB_STEP_SUMMARY}"
          fi

          checksum_name="${apk_name}.sha256"
          checksum_path="${RUNNER_TEMP}/${checksum_name}"
          (
            cd "${RUNNER_TEMP}"
            sha256sum "${apk_name}" > "${checksum_name}"
          )

          echo "apk_name=${apk_name}" >> "${GITHUB_OUTPUT}"
          echo "apk_path=${apk_path}" >> "${GITHUB_OUTPUT}"
          echo "checksum_name=${checksum_name}" >> "${GITHUB_OUTPUT}"
          echo "checksum_path=${checksum_path}" >> "${GITHUB_OUTPUT}"

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f \
            android/app/secure.properties \
            "${RUNNER_TEMP}/organicmaps-in-car-release.keystore" \
            "${RUNNER_TEMP}/in-car-keytool.txt"

      - name: Stage GitHub release with verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
          CHECKSUM_PATH: ${{ steps.apk.outputs.checksum_path }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          KEEP_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          args=(
            "${RELEASE_TAG}"
            "${APK_PATH}"
            "${CHECKSUM_PATH}"
            --repo "${GITHUB_REPOSITORY}"
            --target "${GITHUB_SHA}"
            --title "Organic Maps In-Car v${RELEASE_VERSION}"
            --generate-notes
            --draft
          )
          if [[ -n "${PREVIOUS_TAG}" ]]; then
            args+=(--notes-start-tag "${PREVIOUS_TAG}")
          fi
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi

          {
            echo "# Manual In-Car Release"
            echo
            printf -- '- Source: `%s`\n' "${GITHUB_SHA}"
            printf -- '- Tag: `%s`\n' "${RELEASE_TAG}"
            printf -- '- APK: `%s`\n' "${APK_NAME}"
            printf -- '- Requested final visibility: `draft=%s`\n' "${KEEP_DRAFT}"
          } >> "${GITHUB_STEP_SUMMARY}"

          gh release create "${args[@]}"

  publish:
    name: Publish staged release
    needs: release
    if: ${{ inputs.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
