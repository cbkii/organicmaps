name: Manual In-Car Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump when version is blank'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: 'Explicit in-car version (MAJOR.MINOR.PATCH). Overrides bump when set.'
        required: false
        type: string
      draft:
        description: 'Leave the verified GitHub release as a draft'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: manual-in-car-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish InCarRelease
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 200
          fetch-tags: true

      - name: Validate release branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          default_branch="$(gh repo view "${GITHUB_REPOSITORY}" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "${default_branch}" ]]; then
            echo "::error::In-car releases must run from the repository default branch (${default_branch}); selected ref is ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Resolve in-car version
        id: version
        shell: bash
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          parse_semver() {
            local value="$1"
            if [[ ! "${value}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              return 1
            fi
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            if (( major > 999 || minor > 999 || patch > 999 )); then
              return 1
            fi
          }

          version_code_for() {
            local major="$1"
            local minor="$2"
            local patch="$3"
            echo $((1000000000 + major * 1000000 + minor * 1000 + patch))
          }

          latest="$(
            git tag --list 'in-car-v*' \
              | grep -E '^in-car-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
              | sort -V \
              | tail -n1 \
              || true
          )"
          previous_tag="${latest}"
          previous_code=0
          if [[ -n "${latest}" ]]; then
            previous_version="${latest#in-car-v}"
            if ! parse_semver "${previous_version}"; then
              echo "::error::Unable to parse latest in-car tag: ${latest}"
              exit 1
            fi
            previous_code="$(version_code_for "${major}" "${minor}" "${patch}")"
          fi

          requested="$(printf '%s' "${INPUT_VERSION}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          requested="${requested#in-car-v}"
          requested="${requested#v}"

          if [[ -n "${requested}" ]]; then
            if ! parse_semver "${requested}"; then
              echo "::error::Invalid explicit version '${INPUT_VERSION}'. Use MAJOR.MINOR.PATCH with each component between 0 and 999 and no leading zeroes."
              exit 1
            fi
            version="${major}.${minor}.${patch}"
          elif [[ -z "${latest}" ]]; then
            version="0.1.0"
            parse_semver "${version}"
          else
            parse_semver "${latest#in-car-v}"
            case "${INPUT_BUMP}" in
              patch)
                if (( patch >= 999 )); then
                  echo "::error::Patch component is already 999; choose a minor or major bump."
                  exit 1
                fi
                patch=$((patch + 1))
                ;;
              minor)
                if (( minor >= 999 )); then
                  echo "::error::Minor component is already 999; choose a major bump."
                  exit 1
                fi
                minor=$((minor + 1))
                patch=0
                ;;
              major)
                if (( major >= 999 )); then
                  echo "::error::Major component is already 999; no larger encoded in-car version is available."
                  exit 1
                fi
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              *)
                echo "::error::Unsupported bump '${INPUT_BUMP}'."
                exit 1
                ;;
            esac
            version="${major}.${minor}.${patch}"
          fi

          parse_semver "${version}"
          version_code="$(version_code_for "${major}" "${minor}" "${patch}")"
          if (( version_code <= previous_code )); then
            echo "::error::Requested in-car version ${version} is not newer than ${previous_tag}."
            exit 1
          fi

          tag="in-car-v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Git tag '${tag}' already exists."
            exit 1
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "::error::GitHub release '${tag}' already exists."
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "version_name=${version}-InCar" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "previous_tag=${previous_tag}" >> "${GITHUB_OUTPUT}"

          echo "Resolved in-car release: ${tag}"
          echo "Android versionCode: ${version_code}"
          echo "Android versionName: ${version}-InCar"

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ninja-build

      - name: Initialise submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --depth 1 --init --recursive --jobs="$(($(nproc) * 20))"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Organic Maps Android build tools
        id: android_tools
        shell: bash
        run: |
          set -euo pipefail

          compile_sdk="$(sed -n 's/^propCompileSdkVersion=//p' android/gradle.properties | head -n1)"
          ndk_version="$(sed -n 's/^propNdkVersion=//p' android/gradle.properties | head -n1)"
          build_tools_version="36.0.0"
          cmake_version="3.22.1"

          if [[ ! "${compile_sdk}" =~ ^[0-9]+$ ]] || [[ -z "${ndk_version}" ]]; then
            echo "::error::Unable to resolve compile SDK / NDK versions from android/gradle.properties."
            exit 1
          fi

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${compile_sdk}" \
            "build-tools;${build_tools_version}" \
            "cmake;${cmake_version}" \
            "ndk;${ndk_version}"

          echo "${ANDROID_HOME}/cmake/${cmake_version}/bin" >> "${GITHUB_PATH}"
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > android/local.properties

      - name: Configure Organic Maps
        shell: bash
        run: bash ./configure.sh

      - name: Configure release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "${KEYSTORE_BASE64}" ]] || missing+=(KEYSTORE_BASE64)
          [[ -n "${KEYSTORE_PASSWORD}" ]] || missing+=(KEYSTORE_PASSWORD)
          [[ -n "${KEY_ALIAS}" ]] || missing+=(KEY_ALIAS)
          [[ -n "${KEY_PASSWORD}" ]] || missing+=(KEY_PASSWORD)
          if [[ "${#missing[@]}" -ne 0 ]]; then
            echo "::error::Missing required release signing secret(s): ${missing[*]}"
            exit 1
          fi

          keystore="${RUNNER_TEMP}/organicmaps-in-car-release.keystore"
          if ! printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"; then
            echo "::error::KEYSTORE_BASE64 could not be decoded."
            exit 1
          fi
          chmod 600 "${keystore}"

          keytool_output="${RUNNER_TEMP}/in-car-keytool.txt"
          if ! keytool -list -v \
              -keystore "${keystore}" \
              -alias "${KEY_ALIAS}" \
              -storepass "${KEYSTORE_PASSWORD}" > "${keytool_output}" 2>&1; then
            echo "::error::Unable to open the configured release keystore/alias."
            exit 1
          fi

          cert_sha256="$(
            sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' "${keytool_output}" \
              | head -n1 \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )"
          if [[ ! "${cert_sha256}" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::Unable to resolve the release certificate SHA-256 fingerprint."
            exit 1
          fi

          : > android/app/secure.properties
          echo "keystore=${keystore}" >> "${GITHUB_OUTPUT}"
          echo "cert_sha256=${cert_sha256}" >> "${GITHUB_OUTPUT}"
          echo "Release signing certificate SHA-256: ${cert_sha256}"

      - name: Build signed arm64 InCarRelease APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail

          export ORG_GRADLE_PROJECT_spropStoreFile="${KEYSTORE_PATH}"
          export ORG_GRADLE_PROJECT_spropStorePassword="${KEYSTORE_PASSWORD}"
          export ORG_GRADLE_PROJECT_spropKeyAlias="${KEY_ALIAS}"
          export ORG_GRADLE_PROJECT_spropKeyPassword="${KEY_PASSWORD}"

          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            -Parm64 \
            -PinCarReleaseVersionName="${RELEASE_VERSION}" \
            -PinCarReleaseVersionCode="${RELEASE_VERSION_CODE}" \
            assembleInCarRelease

      - name: Verify and stage InCarRelease APK
        id: apk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          EXPECTED_CERT_SHA256: ${{ steps.signing.outputs.cert_sha256 }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail

          output_dir="android/app/build/outputs/apk/inCar/release"
          proof_dir="${RUNNER_TEMP}/in-car-release-proof"
          rm -rf "${proof_dir}"
          mkdir -p "${proof_dir}"

          mapfile -t apks < <(find "${output_dir}" -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one InCarRelease APK in ${output_dir}, found ${#apks[@]}."
            printf '%s\n' "${apks[@]:-}"
            exit 1
          fi

          apk_name="OrganicMaps-InCar-v${RELEASE_VERSION}-arm64-v8a.apk"
          apk_path="${RUNNER_TEMP}/${apk_name}"
          cp "${apks[0]}" "${apk_path}"

          apksigner="$(
            find "${ANDROID_HOME}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -perm -u+x \
              | sort -V \
              | tail -n1
          )"
          if [[ -z "${apksigner}" ]]; then
            echo "::error::apksigner was not found in the Android SDK."
            exit 1
          fi

          apkanalyzer="$(command -v apkanalyzer || true)"
          if [[ -z "${apkanalyzer}" ]]; then
            apkanalyzer="$(
              find "${ANDROID_HOME}/cmdline-tools" -type f -name apkanalyzer -perm -u+x 2>/dev/null \
                | sort -V \
                | tail -n1
            )"
          fi
          if [[ -z "${apkanalyzer}" ]]; then
            echo "::error::apkanalyzer was not found in PATH or the Android SDK."
            exit 1
          fi

          if ! unzip -tq "${apk_path}" >/dev/null; then
            echo "::error::The staged InCarRelease APK failed ZIP integrity verification."
            exit 1
          fi

          signer_output="${proof_dir}/apksigner.txt"
          if ! "${apksigner}" verify --verbose --print-certs "${apk_path}" > "${signer_output}"; then
            echo "::error::The staged InCarRelease APK failed signature verification."
            cat "${signer_output}"
            exit 1
          fi

          apk_cert_sha256="$(
            sed -n 's/^Signer #1 certificate SHA-256 digest:[[:space:]]*//p' "${signer_output}" \
              | head -n1 \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )"
          if [[ "${apk_cert_sha256}" != "${EXPECTED_CERT_SHA256}" ]]; then
            echo "::error::APK signer ${apk_cert_sha256:-not found} does not match the configured release certificate ${EXPECTED_CERT_SHA256}."
            exit 1
          fi

          package_name="$("${apkanalyzer}" manifest application-id "${apk_path}")"
          version_name="$("${apkanalyzer}" manifest version-name "${apk_path}")"
          version_code="$("${apkanalyzer}" manifest version-code "${apk_path}")"
          if [[ "${package_name}" != "app.organicmaps.incar" ]]; then
            echo "::error::Unexpected InCarRelease package id: ${package_name:-not found}"
            exit 1
          fi
          if [[ "${version_name}" != "${EXPECTED_VERSION_NAME}" ]]; then
            echo "::error::Unexpected InCarRelease versionName: ${version_name:-not found}; expected ${EXPECTED_VERSION_NAME}."
            exit 1
          fi
          if [[ "${version_code}" != "${EXPECTED_VERSION_CODE}" ]]; then
            echo "::error::Unexpected InCarRelease versionCode: ${version_code:-not found}; expected ${EXPECTED_VERSION_CODE}."
            exit 1
          fi

          manifest="${proof_dir}/manifest.xml"
          zip_list="${proof_dir}/zip-list.txt"
          dex_entries_file="${proof_dir}/dex-entries.txt"
          dex_strings="${proof_dir}/dex-strings.txt"

          "${apkanalyzer}" manifest print "${apk_path}" > "${manifest}"
          unzip -Z1 "${apk_path}" > "${zip_list}"
          grep -E '^classes([0-9]+)?\.dex$' "${zip_list}" > "${dex_entries_file}" || true
          mapfile -t dex_entries < "${dex_entries_file}"
          if [[ "${#dex_entries[@]}" -eq 0 ]]; then
            echo "::error::No classes*.dex entries were found in InCarRelease APK."
            exit 1
          fi

          : > "${dex_strings}"
          for dex_entry in "${dex_entries[@]}"; do
            dex_file="${proof_dir}/$(basename "${dex_entry}")"
            unzip -p "${apk_path}" "${dex_entry}" > "${dex_file}"
            strings "${dex_file}" >> "${dex_strings}"
          done

          forbidden_manifest=(
            'app.organicmaps.car.AndroidAutoService'
            'androidx.car.app.NAVIGATION_TEMPLATES'
            'androidx.car.app.ACCESS_SURFACE'
            'app.organicmaps.editor.EditorActivity'
            'app.organicmaps.editor.ProfileActivity'
            'app.organicmaps.editor.FeatureCategoryActivity'
            'app.organicmaps.editor.ReportActivity'
            'app.organicmaps.editor.OsmLoginActivity'
          )
          for needle in "${forbidden_manifest[@]}"; do
            if grep -Fq -- "${needle}" "${manifest}"; then
              echo "::error::Forbidden in-car manifest entry remains: ${needle}"
              exit 1
            fi
          done

          required_manifest=(
            'app.organicmaps.location.TrackRecordingService'
            'app.organicmaps.DownloadResourcesActivity'
          )
          for needle in "${required_manifest[@]}"; do
            if ! grep -Fq -- "${needle}" "${manifest}"; then
              echo "::error::Required in-car manifest entry is missing: ${needle}"
              exit 1
            fi
          done

          forbidden_dex=(
            'Lapp/organicmaps/car/'
            'Landroidx/car/app/'
            'Lapp/organicmaps/intent/GoogleAssistantIntentBridge;'
            'Landroidx/work/'
            'Lapp/organicmaps/editor/EditorActivity;'
            'Lapp/organicmaps/editor/ProfileActivity;'
            'Lapp/organicmaps/editor/FeatureCategoryActivity;'
            'Lapp/organicmaps/editor/ReportActivity;'
            'Lapp/organicmaps/editor/OsmLoginActivity;'
          )
          for needle in "${forbidden_dex[@]}"; do
            if grep -Fq -- "${needle}" "${dex_strings}"; then
              echo "::error::Forbidden in-car runtime class/package remains: ${needle}"
              exit 1
            fi
          done

          required_dex=(
            'Lapp/organicmaps/location/TrackRecordingService;'
            'Lapp/organicmaps/downloader/'
            'Lcom/github/mikephil/charting/'
          )
          for needle in "${required_dex[@]}"; do
            if ! grep -Fq -- "${needle}" "${dex_strings}"; then
              echo "::error::Required in-car runtime package/class is missing: ${needle}"
              exit 1
            fi
          done

          mapfile -t abis < <(
            sed -n 's#^lib/\([^/]*\)/.*#\1#p' "${zip_list}" | sort -u
          )
          if [[ "${#abis[@]}" -ne 1 || "${abis[0]}" != "arm64-v8a" ]]; then
            echo "::error::Expected arm64-v8a-only InCarRelease APK; found ABI(s): ${abis[*]:-none}"
            exit 1
          fi

          if [[ -n "${PREVIOUS_TAG}" ]]; then
            previous_dir="${proof_dir}/previous"
            mkdir -p "${previous_dir}"
            if ! gh release view "${PREVIOUS_TAG}" >/dev/null 2>&1; then
              echo "::error::Previous in-car tag ${PREVIOUS_TAG} has no GitHub release; refusing to break signer continuity."
              exit 1
            fi
            if ! gh release download "${PREVIOUS_TAG}" \
                --pattern 'OrganicMaps-InCar-v*-arm64-v8a.apk' \
                --dir "${previous_dir}"; then
              echo "::error::Unable to download the previous in-car release APK from ${PREVIOUS_TAG}."
              exit 1
            fi
            mapfile -t previous_apks < <(find "${previous_dir}" -maxdepth 1 -type f -name '*.apk' -print | sort)
            if [[ "${#previous_apks[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one previous in-car APK for signer continuity; found ${#previous_apks[@]}."
              exit 1
            fi
            previous_signer_output="${proof_dir}/previous-apksigner.txt"
            "${apksigner}" verify --print-certs "${previous_apks[0]}" > "${previous_signer_output}"
            previous_cert_sha256="$(
              sed -n 's/^Signer #1 certificate SHA-256 digest:[[:space:]]*//p' "${previous_signer_output}" \
                | head -n1 \
                | tr -d ':' \
                | tr '[:lower:]' '[:upper:]'
            )"
            if [[ "${previous_cert_sha256}" != "${apk_cert_sha256}" ]]; then
              echo "::error::Signer continuity check failed: previous ${previous_cert_sha256:-not found}, current ${apk_cert_sha256}."
              exit 1
            fi
          fi

          checksum_name="${apk_name}.sha256"
          checksum_path="${RUNNER_TEMP}/${checksum_name}"
          (
            cd "${RUNNER_TEMP}"
            sha256sum "${apk_name}" > "${checksum_name}"
          )
          apk_sha256="$(awk '{print $1}' "${checksum_path}")"

          echo "apk_name=${apk_name}" >> "${GITHUB_OUTPUT}"
          echo "apk_path=${apk_path}" >> "${GITHUB_OUTPUT}"
          echo "checksum_name=${checksum_name}" >> "${GITHUB_OUTPUT}"
          echo "checksum_path=${checksum_path}" >> "${GITHUB_OUTPUT}"
          echo "apk_sha256=${apk_sha256}" >> "${GITHUB_OUTPUT}"
          echo "cert_sha256=${apk_cert_sha256}" >> "${GITHUB_OUTPUT}"

          {
            echo "### In-car release proof"
            echo
            echo "- Package: \`${package_name}\`"
            echo "- versionName: \`${version_name}\`"
            echo "- versionCode: \`${version_code}\`"
            echo "- ABI: \`arm64-v8a\` only"
            echo "- Signer SHA-256: \`${apk_cert_sha256}\`"
            echo "- APK SHA-256: \`${apk_sha256}\`"
            echo "- Android Auto manifest/runtime: absent"
            echo "- Google Assistant bridge/runtime: absent"
            echo "- WorkManager runtime: absent"
            echo "- OSM editor Android activities: absent"
            echo "- Required navigation/runtime surfaces: present"
            if [[ -n "${PREVIOUS_TAG}" ]]; then
              echo "- Signer continuity with \`${PREVIOUS_TAG}\`: verified"
            else
              echo "- Signer continuity: first in-car release"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrganicMaps-InCar-v${{ steps.version.outputs.version }}-arm64-v8a
          path: |
            ${{ steps.apk.outputs.apk_path }}
            ${{ steps.apk.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create draft GitHub release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          args=(
            "${RELEASE_TAG}"
            --target "${GITHUB_SHA}"
            --title "Organic Maps In-Car v${RELEASE_VERSION}"
            --generate-notes
            --draft
          )
          if [[ -n "${PREVIOUS_TAG}" ]]; then
            args+=(--notes-start-tag "${PREVIOUS_TAG}")
          fi
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
          echo "created=true" >> "${GITHUB_OUTPUT}"
          release_url="$(gh release view "${RELEASE_TAG}" --json url --jq '.url')"
          echo "url=${release_url}" >> "${GITHUB_OUTPUT}"

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          CHECKSUM_PATH: ${{ steps.apk.outputs.checksum_path }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" "${APK_PATH}" "${CHECKSUM_PATH}"

      - name: Verify draft release and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
          CHECKSUM_NAME: ${{ steps.apk.outputs.checksum_name }}
        run: |
          set -euo pipefail

          is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')"
          if [[ "${is_draft}" != "true" ]]; then
            echo "::error::Release ${RELEASE_TAG} was expected to remain draft until verification completed."
            exit 1
          fi

          assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          missing=()
          grep -Fx -- "${APK_NAME}" <<< "${assets}" >/dev/null || missing+=("${APK_NAME}")
          grep -Fx -- "${CHECKSUM_NAME}" <<< "${assets}" >/dev/null || missing+=("${CHECKSUM_NAME}")
          if [[ "${#missing[@]}" -ne 0 ]]; then
            echo "::error::Draft release ${RELEASE_TAG} is missing expected asset(s): ${missing[*]}"
            printf 'Published assets:\n%s\n' "${assets}"
            exit 1
          fi

      - name: Finalise release visibility
        id: finalise
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          KEEP_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          if [[ "${KEEP_DRAFT}" == "true" ]]; then
            echo "state=draft" >> "${GITHUB_OUTPUT}"
            echo "Verified release ${RELEASE_TAG} remains a draft."
          else
            gh release edit "${RELEASE_TAG}" --draft=false
            is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')"
            if [[ "${is_draft}" != "false" ]]; then
              echo "::error::Release ${RELEASE_TAG} did not become public."
              exit 1
            fi
            echo "state=published" >> "${GITHUB_OUTPUT}"
            echo "Published verified release ${RELEASE_TAG}."
          fi

      - name: Roll back incomplete draft release
        if: failure() && steps.release.outputs.created == 'true' && steps.finalise.outcome != 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft' 2>/dev/null || printf 'unknown')"
          if [[ "${is_draft}" == "true" ]]; then
            if gh release delete "${RELEASE_TAG}" --cleanup-tag --yes; then
              echo "Removed incomplete draft release ${RELEASE_TAG} and its tag."
            else
              echo "::warning::Unable to remove incomplete draft release ${RELEASE_TAG}; manual cleanup may be required."
            fi
          elif [[ "${is_draft}" == "false" ]]; then
            echo "::warning::Release ${RELEASE_TAG} is already public; rollback will not delete it."
          else
            echo "::warning::Unable to determine release state for ${RELEASE_TAG}; refusing automatic deletion."
          fi

      - name: Write release summary
        if: always()
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASE_STATE: ${{ steps.finalise.outputs.state }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
          APK_SHA256: ${{ steps.apk.outputs.apk_sha256 }}
          CERT_SHA256: ${{ steps.apk.outputs.cert_sha256 }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          {
            echo "# Manual In-Car Release"
            echo
            echo "- Result: \`${{ job.status }}\`"
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Tag: \`${RELEASE_TAG:-not resolved}\`"
            echo "- Variant: \`InCarRelease\`"
            echo "- Package: \`app.organicmaps.incar\`"
            echo "- versionName: \`${VERSION_NAME:-not resolved}\`"
            echo "- versionCode: \`${VERSION_CODE:-not resolved}\`"
            echo "- ABI: \`arm64-v8a\`"
            echo "- APK: \`${APK_NAME:-not built}\`"
            echo "- APK SHA-256: \`${APK_SHA256:-not verified}\`"
            echo "- Signer SHA-256: \`${CERT_SHA256:-not verified}\`"
            echo "- Previous in-car tag: \`${PREVIOUS_TAG:-none}\`"
            echo "- Final release state: \`${RELEASE_STATE:-not finalised}\`"
            if [[ -n "${RELEASE_URL:-}" ]]; then
              echo "- Release: ${RELEASE_URL}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f \
            android/app/secure.properties \
            "${RUNNER_TEMP}/organicmaps-in-car-release.keystore" \
            "${RUNNER_TEMP}/in-car-keytool.txt"
