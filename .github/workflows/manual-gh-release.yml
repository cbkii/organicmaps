name: Manual GH Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version/tag (for example v1.2.3). Leave blank to auto-increment the patch version.'
        required: false
        type: string
      draft:
        description: 'Create the GitHub release as a draft'
        required: true
        default: false
        type: boolean
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: manual-gh-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Organic Maps
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Organic Maps Android build tools
        id: android_tools
        shell: bash
        run: |
          set -euo pipefail

          compile_sdk="$(sed -n 's/^propCompileSdkVersion=//p' android/gradle.properties | head -n1)"
          ndk_version="$(sed -n 's/^propNdkVersion=//p' android/gradle.properties | head -n1)"
          cmake_version="3.22.1"

          if [[ ! "${compile_sdk}" =~ ^[0-9]+$ ]] || [[ -z "${ndk_version}" ]]; then
            echo "::error::Unable to resolve compile SDK / NDK versions from android/gradle.properties."
            exit 1
          fi

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${compile_sdk}" \
            "build-tools;${compile_sdk}.0.0" \
            "cmake;${cmake_version}" \
            "ndk;${ndk_version}"

          echo "${ANDROID_HOME}/cmake/${cmake_version}/bin" >> "${GITHUB_PATH}"
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > android/local.properties

          echo "compile_sdk=${compile_sdk}" >> "${GITHUB_OUTPUT}"
          echo "ndk_version=${ndk_version}" >> "${GITHUB_OUTPUT}"
          echo "cmake_version=${cmake_version}" >> "${GITHUB_OUTPUT}"

      - name: Configure Organic Maps
        shell: bash
        run: bash ./configure.sh

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          requested="$(printf '%s' "${INPUT_VERSION}" | tr -d '[:space:]')"

          if [[ -n "${requested}" ]]; then
            requested="${requested#v}"
            if [[ ! "${requested}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid version '${INPUT_VERSION}'. Use MAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH."
              exit 1
            fi
            tag="v${requested}"
          else
            latest="$(
              git tag --list 'v*' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n1 \
                || true
            )"

            if [[ -z "${latest}" ]]; then
              tag="v0.0.1"
            else
              core="${latest#v}"
              IFS='.' read -r major minor patch <<< "${core}"
              tag="v${major}.${minor}.$((patch + 1))"
            fi
          fi

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Git tag '${tag}' already exists."
            exit 1
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "::error::GitHub release '${tag}' already exists."
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
          echo "Resolved release tag: ${tag}"

      - name: Configure release signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          present=0
          for value in \
            "${ANDROID_KEYSTORE_BASE64}" \
            "${ANDROID_KEYSTORE_PASSWORD}" \
            "${ANDROID_KEY_ALIAS}" \
            "${ANDROID_KEY_PASSWORD}"; do
            if [[ -n "${value}" ]]; then
              present=$((present + 1))
            fi
          done

          # build.gradle only enables release signing when this file exists.
          : > android/app/secure.properties

          if [[ "${present}" -eq 4 ]]; then
            keystore="${RUNNER_TEMP}/organicmaps-release.keystore"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
            chmod 600 "${keystore}"
            echo "mode=custom" >> "${GITHUB_OUTPUT}"
            echo "keystore=${keystore}" >> "${GITHUB_OUTPUT}"
            echo "Using private release signing secrets."
          elif [[ "${present}" -eq 0 ]]; then
            keystore="${GITHUB_WORKSPACE}/android/app/debug.keystore"
            echo "::warning::No Android signing secrets are configured. The Fdroid Beta APK will use Organic Maps' checked-in debug key so the workflow remains installable and repeatable. Configure all four ANDROID_KEYSTORE_* secrets before distributing beyond personal/testing use."
            echo "mode=debug" >> "${GITHUB_OUTPUT}"
            echo "keystore=${keystore}" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::Android signing secrets are incomplete. Configure all four of ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD, or remove all four to use the debug-key fallback."
            exit 1
          fi

      - name: Build redistributable arm64 Fdroid Beta APK
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          export ORG_GRADLE_PROJECT_spropStoreFile="${KEYSTORE_PATH}"

          if [[ "${SIGNING_MODE}" == "custom" ]]; then
            export ORG_GRADLE_PROJECT_spropStorePassword="${ANDROID_KEYSTORE_PASSWORD}"
            export ORG_GRADLE_PROJECT_spropKeyAlias="${ANDROID_KEY_ALIAS}"
            export ORG_GRADLE_PROJECT_spropKeyPassword="${ANDROID_KEY_PASSWORD}"
          else
            export ORG_GRADLE_PROJECT_spropStorePassword="12345678"
            export ORG_GRADLE_PROJECT_spropKeyAlias="debug"
            export ORG_GRADLE_PROJECT_spropKeyPassword="12345678"
          fi

          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleFdroidBeta -Parm64

      - name: Verify and stage APK
        id: apk
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          output_dir="android/app/build/outputs/apk/fdroid/beta"
          mapfile -t apks < <(find "${output_dir}" -maxdepth 1 -type f -name '*.apk' | sort)

          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Fdroid Beta APK in ${output_dir}, found ${#apks[@]}."
            printf '%s\n' "${apks[@]:-}"
            exit 1
          fi

          apk_name="OrganicMaps-${RELEASE_TAG}-arm64-v8a-FdroidBeta.apk"
          apk_path="${RUNNER_TEMP}/${apk_name}"
          cp "${apks[0]}" "${apk_path}"

          apksigner="$(
            find "${ANDROID_HOME}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner \
              | sort -V \
              | tail -n1
          )"
          if [[ -z "${apksigner}" ]]; then
            echo "::error::apksigner was not found in the Android SDK."
            exit 1
          fi

          "${apksigner}" verify --verbose --print-certs "${apk_path}"

          mapfile -t abis < <(
            unzip -Z1 "${apk_path}" \
              | sed -n 's#^lib/\([^/]*\)/.*#\1#p' \
              | sort -u
          )
          if [[ "${#abis[@]}" -ne 1 || "${abis[0]}" != "arm64-v8a" ]]; then
            echo "::error::Expected an arm64-v8a-only APK; found ABI(s): ${abis[*]:-none}"
            exit 1
          fi

          checksum_name="${apk_name}.sha256"
          (
            cd "${RUNNER_TEMP}"
            sha256sum "${apk_name}" > "${checksum_name}"
          )

          echo "apk_name=${apk_name}" >> "${GITHUB_OUTPUT}"
          echo "apk_path=${apk_path}" >> "${GITHUB_OUTPUT}"
          echo "checksum_name=${checksum_name}" >> "${GITHUB_OUTPUT}"
          echo "checksum_path=${RUNNER_TEMP}/${checksum_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrganicMaps-${{ steps.version.outputs.tag }}-arm64
          path: |
            ${{ steps.apk.outputs.apk_path }}
            ${{ steps.apk.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          CHECKSUM_PATH: ${{ steps.apk.outputs.checksum_path }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          args=(
            "${RELEASE_TAG}"
            "${APK_PATH}"
            "${CHECKSUM_PATH}"
            --target "${GITHUB_SHA}"
            --title "${RELEASE_TAG}"
            --generate-notes
          )

          if [[ "${IS_DRAFT}" == "true" ]]; then
            args+=(--draft)
          fi
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
          release_url="$(gh release view "${RELEASE_TAG}" --json url --jq '.url')"
          echo "url=${release_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
          CHECKSUM_NAME: ${{ steps.apk.outputs.checksum_name }}
        run: |
          set -euo pipefail

          assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          grep -Fx -- "${APK_NAME}" <<< "${assets}" >/dev/null
          grep -Fx -- "${CHECKSUM_NAME}" <<< "${assets}" >/dev/null

      - name: Write release summary
        if: always()
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
        run: |
          {
            echo "# Manual GH Release"
            echo
            echo "- Result: \`${{ job.status }}\`"
            echo "- Tag: \`${RELEASE_TAG:-not resolved}\`"
            echo "- APK: \`${APK_NAME:-not built}\`"
            echo "- Variant: \`FdroidBeta\`"
            echo "- ABI: \`arm64-v8a\`"
            echo "- Signing: \`${SIGNING_MODE:-not configured}\`"
            if [[ -n "${RELEASE_URL:-}" ]]; then
              echo "- Release: ${RELEASE_URL}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove temporary signing configuration
        if: always()
        shell: bash
        run: |
          rm -f android/app/secure.properties "${RUNNER_TEMP}/organicmaps-release.keystore"
