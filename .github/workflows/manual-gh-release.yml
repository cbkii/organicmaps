name: Manual GH Release

on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Android product to build'
        required: true
        default: fdroid
        type: choice
        options:
          - fdroid
          - in-car
      version:
        description: 'Release version/tag (for example v1.2.3). Leave blank to auto-increment the patch version.'
        required: false
        type: string
      draft:
        description: 'Create the GitHub release as a draft'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: manual-gh-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Organic Maps
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Organic Maps Android build tools
        id: android_tools
        shell: bash
        run: |
          set -euo pipefail

          compile_sdk="$(sed -n 's/^propCompileSdkVersion=//p' android/gradle.properties | head -n1)"
          ndk_version="$(sed -n 's/^propNdkVersion=//p' android/gradle.properties | head -n1)"
          build_tools_version="36.0.0"
          cmake_version="3.22.1"

          if [[ ! "${compile_sdk}" =~ ^[0-9]+$ ]] || [[ -z "${ndk_version}" ]]; then
            echo "::error::Unable to resolve compile SDK / NDK versions from android/gradle.properties."
            exit 1
          fi

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${compile_sdk}" \
            "build-tools;${build_tools_version}" \
            "cmake;${cmake_version}" \
            "ndk;${ndk_version}"

          echo "${ANDROID_HOME}/cmake/${cmake_version}/bin" >> "${GITHUB_PATH}"
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > android/local.properties

          echo "compile_sdk=${compile_sdk}" >> "${GITHUB_OUTPUT}"
          echo "build_tools_version=${build_tools_version}" >> "${GITHUB_OUTPUT}"
          echo "ndk_version=${ndk_version}" >> "${GITHUB_OUTPUT}"
          echo "cmake_version=${cmake_version}" >> "${GITHUB_OUTPUT}"

      - name: Configure Organic Maps
        shell: bash
        run: bash ./configure.sh

      - name: Validate release branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          default_branch="$(gh repo view "${GITHUB_REPOSITORY}" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "${default_branch}" ]]; then
            echo "::error::Manual GH releases must run from the repository default branch (${default_branch}); selected ref is ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Resolve product variant
        id: product
        shell: bash
        env:
          INPUT_PRODUCT: ${{ inputs.product }}
        run: |
          set -euo pipefail

          case "${INPUT_PRODUCT}" in
            fdroid)
              echo 'gradle_task=assembleFdroidBeta' >> "${GITHUB_OUTPUT}"
              echo 'output_dir=android/app/build/outputs/apk/fdroid/beta' >> "${GITHUB_OUTPUT}"
              echo 'variant=FdroidBeta' >> "${GITHUB_OUTPUT}"
              echo 'asset_product=FdroidBeta' >> "${GITHUB_OUTPUT}"
              ;;
            in-car)
              echo 'gradle_task=assembleInCarBeta' >> "${GITHUB_OUTPUT}"
              echo 'output_dir=android/app/build/outputs/apk/inCar/beta' >> "${GITHUB_OUTPUT}"
              echo 'variant=InCarBeta' >> "${GITHUB_OUTPUT}"
              echo 'asset_product=in-car' >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error::Unsupported product: ${INPUT_PRODUCT}"
              exit 1
              ;;
          esac

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          requested="$(printf '%s' "${INPUT_VERSION}" | tr -d '[:space:]')"

          if [[ -n "${requested}" ]]; then
            requested="${requested#v}"
            if [[ ! "${requested}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid version '${INPUT_VERSION}'. Use MAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH."
              exit 1
            fi
            tag="v${requested}"
          else
            release_tags="$(gh release list --limit 1000 --json tagName --jq '.[].tagName' 2>/dev/null || true)"
            git_tags="$(git tag --list 'v*')"
            latest="$(
              printf '%s\n%s\n' "${release_tags}" "${git_tags}" \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -Vu \
                | tail -n1 \
                || true
            )"

            if [[ -z "${latest}" ]]; then
              tag="v0.1.0"
            else
              core="${latest#v}"
              IFS='.' read -r major minor patch <<< "${core}"
              tag="v${major}.${minor}.$((patch + 1))"
            fi
          fi

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Git tag '${tag}' already exists."
            exit 1
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "::error::GitHub release '${tag}' already exists."
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
          echo "Resolved release tag: ${tag}"

      - name: Configure release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          present=0
          for value in \
            "${KEYSTORE_BASE64}" \
            "${KEYSTORE_PASSWORD}" \
            "${KEY_ALIAS}" \
            "${KEY_PASSWORD}"; do
            if [[ -n "${value}" ]]; then
              present=$((present + 1))
            fi
          done

          # build.gradle only enables release signing when this file exists.
          : > android/app/secure.properties

          if [[ "${present}" -eq 4 ]]; then
            keystore="${RUNNER_TEMP}/organicmaps-release.keystore"
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
            chmod 600 "${keystore}"
            echo "mode=custom" >> "${GITHUB_OUTPUT}"
            echo "keystore=${keystore}" >> "${GITHUB_OUTPUT}"
            echo "Using private release signing secrets."
          elif [[ "${present}" -eq 0 ]]; then
            keystore="${GITHUB_WORKSPACE}/android/app/debug.keystore"
            echo "::warning::No Android signing secrets are configured. The selected Beta APK will use Organic Maps' checked-in debug key so the workflow remains installable and repeatable. Configure the existing KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets before distributing beyond personal/testing use."
            echo "mode=debug" >> "${GITHUB_OUTPUT}"
            echo "keystore=${keystore}" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::Android signing secrets are incomplete. Configure all four of KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD, or remove all four to use the debug-key fallback."
            exit 1
          fi

      - name: Build redistributable arm64 APK
        shell: bash
        env:
          GRADLE_TASK: ${{ steps.product.outputs.gradle_task }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          export ORG_GRADLE_PROJECT_spropStoreFile="${KEYSTORE_PATH}"

          if [[ "${SIGNING_MODE}" == "custom" ]]; then
            export ORG_GRADLE_PROJECT_spropStorePassword="${KEYSTORE_PASSWORD}"
            export ORG_GRADLE_PROJECT_spropKeyAlias="${KEY_ALIAS}"
            export ORG_GRADLE_PROJECT_spropKeyPassword="${KEY_PASSWORD}"
          else
            export ORG_GRADLE_PROJECT_spropStorePassword="12345678"
            export ORG_GRADLE_PROJECT_spropKeyAlias="debug"
            export ORG_GRADLE_PROJECT_spropKeyPassword="12345678"
          fi

          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace "${GRADLE_TASK}" -Parm64

      - name: Verify and stage APK
        id: apk
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          OUTPUT_DIR: ${{ steps.product.outputs.output_dir }}
          ASSET_PRODUCT: ${{ steps.product.outputs.asset_product }}
          PRODUCT: ${{ inputs.product }}
        run: |
          set -euo pipefail

          mapfile -t apks < <(find "${OUTPUT_DIR}" -maxdepth 1 -type f -name '*.apk' | sort)

          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one APK in ${OUTPUT_DIR}, found ${#apks[@]}."
            printf '%s\n' "${apks[@]:-}"
            exit 1
          fi

          apk_name="OrganicMaps-${RELEASE_TAG}-arm64-v8a-${ASSET_PRODUCT}.apk"
          apk_path="${RUNNER_TEMP}/${apk_name}"
          cp "${apks[0]}" "${apk_path}"

          apksigner="$(
            find "${ANDROID_HOME}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner \
              | sort -V \
              | tail -n1
          )"
          if [[ -z "${apksigner}" ]]; then
            echo "::error::apksigner was not found in the Android SDK."
            exit 1
          fi

          "${apksigner}" verify --verbose --print-certs "${apk_path}"

          mapfile -t abis < <(
            unzip -Z1 "${apk_path}" \
              | sed -n 's#^lib/\([^/]*\)/.*#\1#p' \
              | sort -u
          )
          if [[ "${#abis[@]}" -ne 1 || "${abis[0]}" != "arm64-v8a" ]]; then
            echo "::error::Expected an arm64-v8a-only APK; found ABI(s): ${abis[*]:-none}"
            exit 1
          fi

          if [[ "${PRODUCT}" == 'in-car' ]]; then
            package_name="$(aapt dump badging "${apk_path}" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
            if [[ "${package_name}" != 'app.organicmaps.incar.beta' ]]; then
              echo "::error::Unexpected in-car Beta package id: ${package_name:-not found}"
              exit 1
            fi
          fi

          checksum_name="${apk_name}.sha256"
          (
            cd "${RUNNER_TEMP}"
            sha256sum "${apk_name}" > "${checksum_name}"
          )

          echo "apk_name=${apk_name}" >> "${GITHUB_OUTPUT}"
          echo "apk_path=${apk_path}" >> "${GITHUB_OUTPUT}"
          echo "checksum_name=${checksum_name}" >> "${GITHUB_OUTPUT}"
          echo "checksum_path=${RUNNER_TEMP}/${checksum_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrganicMaps-${{ steps.version.outputs.tag }}-${{ steps.product.outputs.asset_product }}-arm64
          path: |
            ${{ steps.apk.outputs.apk_path }}
            ${{ steps.apk.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          CHECKSUM_PATH: ${{ steps.apk.outputs.checksum_path }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          args=(
            "${RELEASE_TAG}"
            "${APK_PATH}"
            "${CHECKSUM_PATH}"
            --target "${GITHUB_SHA}"
            --title "${RELEASE_TAG}"
            --generate-notes
          )

          if [[ "${IS_DRAFT}" == "true" ]]; then
            args+=(--draft)
          fi
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
          release_url="$(gh release view "${RELEASE_TAG}" --json url --jq '.url')"
          echo "url=${release_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
          CHECKSUM_NAME: ${{ steps.apk.outputs.checksum_name }}
        run: |
          set -euo pipefail

          assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          missing=()

          grep -Fx -- "${APK_NAME}" <<< "${assets}" >/dev/null || missing+=("${APK_NAME}")
          grep -Fx -- "${CHECKSUM_NAME}" <<< "${assets}" >/dev/null || missing+=("${CHECKSUM_NAME}")

          if [[ "${#missing[@]}" -ne 0 ]]; then
            echo "::error::Release ${RELEASE_TAG} is missing expected asset(s): ${missing[*]}"
            echo "Published assets:"
            printf '%s\n' "${assets}"
            exit 1
          fi

      - name: Write release summary
        if: always()
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
          PRODUCT: ${{ inputs.product }}
          VARIANT: ${{ steps.product.outputs.variant }}
        run: |
          {
            echo "# Manual GH Release"
            echo
            echo "- Result: \`${{ job.status }}\`"
            echo "- Tag: \`${RELEASE_TAG:-not resolved}\`"
            echo "- Product: \`${PRODUCT}\`"
            echo "- APK: \`${APK_NAME:-not built}\`"
            echo "- Variant: \`${VARIANT:-not resolved}\`"
            echo "- ABI: \`arm64-v8a\`"
            echo "- Signing: \`${SIGNING_MODE:-not configured}\`"
            if [[ -n "${RELEASE_URL:-}" ]]; then
              echo "- Release: ${RELEASE_URL}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove temporary signing configuration
        if: always()
        shell: bash
        run: |
          rm -f android/app/secure.properties "${RUNNER_TEMP}/organicmaps-release.keystore"
