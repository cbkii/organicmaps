name: Android Repository Scope

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  repository-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Verify Android-only repository scope
        run: python3 tools/ci/verify_android_repo_scope.py
