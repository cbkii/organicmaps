name: Android Repository Scope

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  repository-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Verify Android-only repository scope
        run: python3 tools/ci/verify_android_repo_scope.py

      - name: Verify track-delete confirmation identity
        run: python3 tools/ci/verify_place_page_delete_dialog.py

      - name: Verify default arrow texture fallback
        run: |
          python3 tools/ci/verify_default_arrow_texture.py
          python3 tools/ci/test_verify_default_arrow_texture.py
