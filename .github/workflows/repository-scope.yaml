name: Android Repository Scope

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  repository-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Verify Android-only repository scope
        run: python3 tools/ci/verify_android_repo_scope.py

  pr22-finish:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 22 && github.event.pull_request.head.ref == 'copilot/rework-incar-ui-navigation'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: copilot/rework-incar-ui-navigation
          fetch-depth: 1

      - name: Install clang-format 22
        shell: bash
        run: |
          sudo apt purge -y clang-format-18
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm-toolchain-noble-22.list
          sudo apt-get update
          sudo apt-get install -y clang-format-22
          sudo update-alternatives --force --install /usr/bin/clang-format clang-format /usr/bin/clang-format-22 10
          sudo update-alternatives --force --install /usr/bin/git-clang-format git-clang-format /usr/bin/git-clang-format-22 10
          clang-format --version

      - name: Apply guarded final integration
        run: python3 tools/ci/pr22_finish.py

      - name: Format and push
        shell: bash
        run: |
          tools/unix/clang-format.sh >/tmp/clang-format.diff 2>&1 || format_rc=$?
          if [ "${format_rc:-0}" -gt 1 ]; then
            cat /tmp/clang-format.diff
            exit "$format_rc"
          fi
          git diff --check
          git status --short
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finish InCar automotive UX integration"
          git push origin HEAD:copilot/rework-incar-ui-navigation
